name: D-255 own KA EN static docs links and scheduled safe public external check
# D255 D252 exact-source: 14 full public docs/QA/security/native checks, no new signup or external redirect.
on:
  push:
    branches: [feat/d255-docs-links-post-d252, feat/d255-docs-internal-external-link-guard, main]
    paths:
      - 'site/docs/**'
      - 'scripts/d255-docs-links.mjs'
      - 'scripts/d255-docs-links.test.mjs'
      - '.github/workflows/d255-docs-links.yml'
  schedule:
    - cron: '37 6 * * 1'
  workflow_dispatch:
concurrency:
  group: d255-docs-${{ github.ref }}
  cancel-in-progress: true
permissions: read-all
jobs:
  local-links:
    if: github.repository == 'dol-1/suliko-ide-ci'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.19.0'
          package-manager-cache: false
      - name: Reproduce internal link and unsafe URL negative tests
        run: node --test scripts/d255-docs-links.test.mjs
      - name: Validate all own public KA EN docs local links without network
        run: node scripts/d255-docs-links.mjs --internal
  weekly-external:
    if: github.repository == 'dol-1/suliko-ide-ci' && github.event_name == 'schedule'
    needs: local-links
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.19.0'
          package-manager-cache: false
      - name: Check public allowlisted GitHub GitLab Pages URLs only, no auto changes
        run: node scripts/d255-docs-links.mjs --scheduled-external
      - name: Retain only sanitized link-status aggregate, no raw page content
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: d255-weekly-docs-link-status
          path: ${{ runner.temp }}/d255-link-audit.json
          retention-days: 1
          if-no-files-found: ignore
