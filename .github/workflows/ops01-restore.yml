# OPS-01: isolated Linux rehearsal; no production data or off-host claim.
name: OPS-01 synthetic BB export-import restore
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/ops01-restore.yml']
permissions:
  contents: read
jobs:
  restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    env:
      BB_TELEMETRY: 'false'
      BB_SERVER_BIND_HOST: '127.0.0.1'
      BB_SERVER_PORT: '38886'
      CI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: get-bb/bb
          ref: desktop-v0.49.0
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.19.0'
          package-manager-cache: false
      - name: Verify exact BB source and build
        run: |
          test "$(git rev-parse HEAD)" = "7b26cae79ec978fafd0a5db0e8517e94f12eb8f4"
          test "$(node -p 'require("./package.json").packageManager')" = "pnpm@9.15.0"
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
          pnpm install --frozen-lockfile
          pnpm run build
      - name: Synthetic source export and fresh restore smoke
        shell: bash
        timeout-minutes: 20
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/ops01-source"
          restore_dir="$RUNNER_TEMP/ops01-restored"
          archive="$RUNNER_TEMP/ops01-backup.tar.gz"
          test ! -e "$source_dir" && test ! -e "$restore_dir" && test ! -e "$archive"
          cleanup() {
            node packages/bb-app/dist/bb-app.js stop --data-dir "$source_dir" >/dev/null 2>&1 || true
            node packages/bb-app/dist/bb-app.js stop --data-dir "$restore_dir" >/dev/null 2>&1 || true
            rm -f "$archive"
          }
          trap cleanup EXIT
          export BB_DATA_DIR="$source_dir"
          node packages/bb-app/dist/bb-app.js start --data-dir "$source_dir" --server-bind-host 127.0.0.1 --server-port 38886 --no-in-app-updates >"$RUNNER_TEMP/ops01-start.log" 2>&1 &
          ready=0
          for i in $(seq 1 45); do
            if node packages/bb-app/dist/bb.js settings show --json >/dev/null 2>&1; then ready=1; break; fi
            sleep 2
          done
          test "$ready" = 1 || { echo "Source loopback server not ready"; exit 1; }
          node packages/bb-app/dist/bb.js settings experiment serverMove true >/dev/null
          node packages/bb-app/dist/bb.js server export --out "$archive" >/dev/null
          test -s "$archive"
          node packages/bb-app/dist/bb-app.js stop --data-dir "$source_dir" >/dev/null
          node packages/bb-app/dist/bb.js server import "$archive" --data-dir "$restore_dir" --yes >/dev/null
          test -s "$restore_dir/bb.db"
          export BB_DATA_DIR="$restore_dir"
          node packages/bb-app/dist/bb-app.js start --data-dir "$restore_dir" --server-bind-host 127.0.0.1 --server-port 38886 --no-in-app-updates >"$RUNNER_TEMP/ops01-restored-start.log" 2>&1 &
          ready=0
          for i in $(seq 1 45); do
            if node packages/bb-app/dist/bb.js settings show --json >"$RUNNER_TEMP/ops01-restored-settings.json" 2>/dev/null; then ready=1; break; fi
            sleep 2
          done
          test "$ready" = 1 || { echo "Restored loopback server not ready"; exit 1; }
          node -e 'const s=require(process.argv[1]); if(s.experiments?.serverMove !== true && s.config?.experiments?.serverMove !== true) throw Error("Restored fixture setting not verified")' "$RUNNER_TEMP/ops01-restored-settings.json"
          echo "Synthetic export/import and restored loopback checks passed on one disposable Linux CI runner. No credentials or archive uploaded." >> "$GITHUB_STEP_SUMMARY"
