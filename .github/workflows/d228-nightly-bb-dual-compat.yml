name: D-228 nightly dual BB 0.49.0 versus exact upstream main SDK (NO bump)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [feat/d228-nightly-bb-dual-compat-after-d229, main]
    paths:
      - .github/workflows/d228-nightly-bb-dual-compat.yml
      - scripts/d228-matrix-result.mjs
      - .github/workflows/d158-codeql-own-source.yml
      - .github/workflows/d063-semgrep.yml
      - .github/workflows/d063-gitleaks.yml
      - .github/workflows/d152-workflow-expression-guard.yml
      - plugins/suliko-hello/**
      - plugins/suliko-remote-panel/**
  schedule:
    - cron: '37 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  plugin-sdk-context:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        sdk: [pinned, upstream-main]
    env:
      SDK_CONTEXT: ${{ matrix.sdk }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.19.0'
      - name: Fetch exact upstream main SHA and SDK manifest (read only)
        id: source
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
          # Read official GitHub public main HEAD exactly once and record the SHA; never guess main.
          MAIN_SHA="$(gh api /repos/get-bb/bb/commits/main --jq '.sha')"
          [[ "$MAIN_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Invalid upstream main SHA' >&2; exit 1; }
          curl --fail --silent --show-error --retry 2 --max-time 30 \
            "https://raw.githubusercontent.com/get-bb/bb/$MAIN_SHA/packages/plugin-sdk/package.json" > "$RUNNER_TEMP/bb-main-sdk.json"
          curl --fail --silent --show-error --retry 2 --max-time 30 \
            https://raw.githubusercontent.com/get-bb/bb/7b26cae79ec978fafd0a5db0e8517e94f12eb8f4/packages/plugin-sdk/package.json > "$RUNNER_TEMP/bb-pin-sdk.json"
          MAIN_SDK="$(node -p 'JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).version' "$RUNNER_TEMP/bb-main-sdk.json")"
          PIN_SDK="$(node -p 'JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).version' "$RUNNER_TEMP/bb-pin-sdk.json")"
          test "$PIN_SDK" = '0.6.132'
          test -n "$MAIN_SDK"
          [[ "$MAIN_SDK" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Unreviewed upstream SDK version syntax' >&2; exit 1; }
          if [ "$SDK_CONTEXT" = 'pinned' ]; then SDK_VERSION="$PIN_SDK"; else SDK_VERSION="$MAIN_SDK"; fi
          echo "SDK_VERSION=$SDK_VERSION" >> "$GITHUB_ENV"
          echo "UPSTREAM_MAIN_SHA=$MAIN_SHA" >> "$GITHUB_ENV"
          echo "sha=$MAIN_SHA" >> "$GITHUB_OUTPUT"
          echo "D064 context=$SDK_CONTEXT upstream_sha=$MAIN_SHA source_sdk=$MAIN_SDK tested_sdk=$SDK_VERSION"
          printf '### D064 SDK test against pinned npm or actual upstream Git source (NOT runtime compatibility)\n\n- Upstream main SHA: %s\n- SDK version declared there: %s\n- SDK version tested: %s (%s; upstream mode builds and packs verified Git main SHA)\n- Pinned desktop-v0.49.0 SDK: %s\n- All edits occur ONLY in disposable runner copies. No BB source is edited.\n- Upstream-main mode requires a successful build of SDK from that exact Git commit; NOT a live BB app runtime test.\n' "$MAIN_SHA" "$MAIN_SDK" "$SDK_VERSION" "$SDK_CONTEXT" "$PIN_SDK" >> "$GITHUB_STEP_SUMMARY"
      - name: Typecheck, test and bundle Hello against exact SDK source
        id: hello
        shell: bash
        run: |
          set -Eeuo pipefail
          stage=BUILD
          mkdir -p "$GITHUB_WORKSPACE/out/d228"
          trap 'printf "%s\n" "$stage" > "$GITHUB_WORKSPACE/out/d228/failure-$SDK_CONTEXT.txt"' ERR
          test "$SDK_CONTEXT" = 'pinned' || test "$SDK_CONTEXT" = 'upstream-main'
          mkdir -p "$RUNNER_TEMP/d064"
          cp -a plugins/suliko-hello "$RUNNER_TEMP/d064/hello"
          cd "$RUNNER_TEMP/d064/hello"
          node - <<'NODE'
          const fs=require('fs'),p=JSON.parse(fs.readFileSync('package.json','utf8'));
          if(p.devDependencies['@get-bb/plugin-sdk']!=='0.6.132'||p.engines.bbPluginSdk!=='>=0.6.132 <0.6.133')throw Error('Unexpected source manifest; do not widen support automatically');
          NODE
          if [ "$SDK_CONTEXT" = 'upstream-main' ]; then
            # The SDK version declared at upstream main may be unpublished on npm.
            # Build and pack the SDK from its *actual checked SHA* in an isolated clone.
            git init -q "$RUNNER_TEMP/d064/upstream"
            git -C "$RUNNER_TEMP/d064/upstream" remote add origin https://github.com/get-bb/bb.git
            git -C "$RUNNER_TEMP/d064/upstream" fetch -q --depth=1 origin "$UPSTREAM_MAIN_SHA"
            git -C "$RUNNER_TEMP/d064/upstream" checkout -q --detach FETCH_HEAD
            test "$(git -C "$RUNNER_TEMP/d064/upstream" rev-parse HEAD)" = "$UPSTREAM_MAIN_SHA" || { echo 'Upstream main advanced mid-run; fail closed' >&2; exit 1; }
            ( cd "$RUNNER_TEMP/d064/upstream"
              pnpm install --frozen-lockfile
              pnpm exec turbo run build --filter='@get-bb/plugin-sdk...'
              cd packages/plugin-sdk
              pnpm pack --pack-destination "$RUNNER_TEMP/d064"
            )
            SDK_ARCHIVE="$(find "$RUNNER_TEMP/d064" -maxdepth 1 -type f -name 'get-bb-plugin-sdk-*.tgz' -print -quit)"
            test -s "$SDK_ARCHIVE" || { echo 'Actual upstream SDK pack missing' >&2; exit 1; }
            echo "SDK_ARCHIVE=$SDK_ARCHIVE" >> "$GITHUB_ENV"
          fi
          pnpm install --no-frozen-lockfile
          if [ "$SDK_CONTEXT" = 'upstream-main' ]; then
            pnpm add -D -E "$SDK_ARCHIVE"
          fi
          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('node_modules/@get-bb/plugin-sdk/package.json','utf8'));
          if(p.version!==process.env.SDK_VERSION)throw Error('Installed SDK version does not match upstream manifest');
          NODE
          stage=SDK_API
          pnpm run typecheck
          stage=RUNTIME
          pnpm test
          stage=BUILD
          pnpm run build
          for file in dist/server.js dist/app.js dist/app.css dist/app.meta.json; do test -s "$file"; done
      - name: Typecheck, test and bundle Remote MOCK panel against exact SDK source
        id: remote
        shell: bash
        run: |
          set -Eeuo pipefail
          stage=BUILD
          mkdir -p "$GITHUB_WORKSPACE/out/d228"
          trap 'printf "%s\n" "$stage" > "$GITHUB_WORKSPACE/out/d228/failure-$SDK_CONTEXT.txt"' ERR
          cp -a plugins/suliko-remote-panel "$RUNNER_TEMP/d064/remote"
          cd "$RUNNER_TEMP/d064/remote"
          node - <<'NODE'
          const fs=require('fs'),p=JSON.parse(fs.readFileSync('package.json','utf8'));
          if(p.devDependencies['@get-bb/plugin-sdk']!=='0.6.132'||p.engines.bbPluginSdk!=='>=0.6.132 <0.6.133')throw Error('Unexpected mock source manifest');
          NODE
          pnpm install --no-frozen-lockfile --ignore-scripts
          if [ "$SDK_CONTEXT" = 'upstream-main' ]; then
            pnpm add -D -E --ignore-scripts "$SDK_ARCHIVE"
          fi
          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('node_modules/@get-bb/plugin-sdk/package.json','utf8'));
          if(p.version!==process.env.SDK_VERSION)throw Error('Installed SDK version does not match upstream manifest');
          NODE
          stage=SDK_API
          pnpm run typecheck
          stage=RUNTIME
          pnpm test
          stage=BUILD
          pnpm exec esbuild app.tsx --bundle --platform=browser --format=esm --jsx=automatic --packages=external --outfile=dist/mock-panel.js
          test -s dist/mock-panel.js
      - name: Record precise scope
        if: always()
        shell: bash
        run: |
          printf '\nD064 compiles/tests own plugins against installed SDK %s; upstream-main source built from recorded Git SHA when selected. Does NOT override engine ranges, prove running BB compatibility, or authorize a version bump.\n' "${SDK_VERSION:-unresolved}" >> "$GITHUB_STEP_SUMMARY"

      - name: D228 fail-closed stage classification and manual issue-DRAFT artifact
        if: always()
        shell: bash
        env:
          D228_SOURCE_OUTCOME: ${{ steps.source.outcome }}
          D228_HELLO_OUTCOME: ${{ steps.hello.outcome }}
          D228_REMOTE_OUTCOME: ${{ steps.remote.outcome }}
          D228_UPSTREAM_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          node scripts/d228-matrix-result.mjs --self-test
          node scripts/d228-matrix-result.mjs
      - name: Retain bounded artifact; NEVER open issues or publish packages
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: d228-compat-${{ matrix.sdk }}
          path: out/d228/
          if-no-files-found: error
          retention-days: 7
