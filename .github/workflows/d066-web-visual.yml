name: D-066 synthetic own Hello and Remote MOCK Web panel screenshots
on:
  push:
    branches: [feat/d066-web-panel-visual-snapshots, main]
    paths:
      - '.github/workflows/d066-web-visual.yml'
      - 'tests/parity/d066-visual.mjs'
      - 'tests/parity/d066-visual-baselines.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screenshot-capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: 'true'
      BB_TELEMETRY: 'false'
      BB_SERVER_BIND_HOST: '127.0.0.1'
      BB_SERVER_PORT: '38887'
      BB_HOST_DAEMON_PORT: '38889'
      BB_VISUAL_URL: 'http://127.0.0.1:38887'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: get-bb/bb
          ref: desktop-v0.49.0
          path: stock-bb
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.19.0'
      - name: Build exact unmodified stock BB
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C stock-bb rev-parse HEAD)" = "7b26cae79ec978fafd0a5db0e8517e94f12eb8f4"
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
          (cd stock-bb && pnpm install --frozen-lockfile && pnpm run build)
      - name: Pin Playwright 1.56.0 and Chromium for synthetic-only capture
        shell: bash
        run: |
          set -euo pipefail
          cd tests/parity
          npm install --no-save --no-package-lock --no-audit --no-fund '@playwright/test@1.56.0'
          test "$(node -p "require('@playwright/test/package.json').version")" = '1.56.0'
          npx playwright install chromium
      - name: Start loopback BB and install ONLY own plugins
        shell: bash
        run: |
          set -euo pipefail
          export BB_DATA_DIR="$RUNNER_TEMP/d066-visual-data"
          mkdir -p "$BB_DATA_DIR"
          node stock-bb/packages/bb-app/dist/bb-app.js start --data-dir "$BB_DATA_DIR" --server-bind-host 127.0.0.1 --server-port 38887 --host-daemon-port 38889 --no-in-app-updates >"$RUNNER_TEMP/d066-visual-server.log" 2>&1 &
          ready=0
          for i in $(seq 1 45); do
            if curl --silent --fail --max-time 2 --output /dev/null http://127.0.0.1:38887/ 2>/dev/null; then ready=1; break; fi
            sleep 2
          done
          test "$ready" = 1 || { echo 'Disposable visual BB not ready' >&2; exit 1; }
          node stock-bb/packages/bb-app/dist/bb.js plugin install ./plugins/suliko-hello --yes >/dev/null
          node stock-bb/packages/bb-app/dist/bb.js plugin install ./plugins/suliko-remote-panel --yes >/dev/null
          folder="$RUNNER_TEMP/d066-visual-synthetic"
          mkdir -p "$folder"
          git -C "$folder" init -b main >/dev/null
          printf 'Synthetic panel screenshots only\n' > "$folder/README.md"
          git -C "$folder" add README.md
          node stock-bb/packages/bb-app/dist/bb.js project create --name d066-visual-synthetic --root "$folder" >/dev/null
          echo "$BB_DATA_DIR" > "$RUNNER_TEMP/d066-visual-data-path"
      - name: Capture four bounded own-panel sections
        shell: bash
        run: |
          export BB_DATA_DIR="$RUNNER_TEMP/d066-visual-data"
          node tests/parity/d066-visual.mjs
          echo 'Four own-panel PNGs captured from synthetic Web only. Capture-only is NOT a cross-run regression gate.' >> "$GITHUB_STEP_SUMMARY"
      - name: Retain only disposable own-panel PNGs for 1 day
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: d066-synthetic-own-panels-only
          path: ${{ runner.temp }}/d066-own-panels/*.png
          retention-days: 1
          if-no-files-found: warn
      - name: Stop disposable BB
        if: always()
        shell: bash
        run: |
          if [ -s "$RUNNER_TEMP/d066-visual-data-path" ]; then
            node stock-bb/packages/bb-app/dist/bb-app.js stop --data-dir "$(cat "$RUNNER_TEMP/d066-visual-data-path")" >/dev/null 2>&1 || true
          fi
