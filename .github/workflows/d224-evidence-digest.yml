name: D-224 daily exact-main evidence artifact, no external comments
on:
  push:
    branches: [feat/d224-main-evidence-after-d208]
    paths:
      - '.github/workflows/d224-evidence-digest.yml'
      - 'scripts/d224-main-evidence.mjs'
  schedule:
    - cron: '27 11 * * *'
concurrency:
  group: d224-main-evidence-${{ github.ref }}
  cancel-in-progress: true
permissions: read-all
jobs:
  digest:
    if: github.repository == 'dol-1/suliko-ide-ci'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.19.0'
          package-manager-cache: false
      - name: Read-only recent actual main runs and negative tests
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/d224-main-evidence.mjs --self-test
          {
            printf '{"branch":'
            gh api /repos/dol-1/suliko-ide-ci/branches/main
            printf ',"runs":'
            gh api '/repos/dol-1/suliko-ide-ci/actions/runs?branch=main&per_page=100'
            printf '}'
          } | node scripts/d224-main-evidence.mjs
      - name: Retain short-lived artifact, no issue comments
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: d224-main-evidence
          path: out/d224/
          retention-days: 7
          if-no-files-found: error
