name: D-064 upstream SDK version contract watcher
on:
  push:
    branches: [feat/d064-compat-watch, main]
    paths: ['scripts/d064-*', '.github/workflows/d064-compat-watch.yml', 'plugins/**/package.json']
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.19.0'
      - run: node --test scripts/d064-compat-watch.test.mjs
      - run: node scripts/d064-compat-watch.mjs
