name: D-063 redacted full-public-git-history Gitleaks
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [feat/d210-bb-upstream-watch, feat/d219-share-readiness-after-d218, feat/d218-tag-install-docs-after-d217, feat/d217-affected-ci-after-main-f98, fix/d215-rc-pin-d117-icon-main-green, feat/d204-live-pages-check, feat/d205-tag-proof-after-pages-fix, draft/d199-owner-rc-sha-main-1c747093, fix/d203-pages-api-response-ownerlint, feat/d203-pages-api-only-gate, feat/d198-doctor-after-d197, feat/d197-locked-cli-after-d199, feat/d199-candidate-main-proof, feat/d189-e3-mock-after-d196, feat/d196-pilot-support-main-replay, feat/d190-docs-as-test-3os, feat/d188-qa-concurrency-isolation, feat/d187-e3-main-push-gate, feat/d186-e3-approval-status-integrity, feat/d169-fastcheck-native-parsers, feat/d165-end-user-one-command, fix/d184-owner-lint-nofollow, feat/d176-repro-builder-env-hardening, feat/d166-repro-rc-candidate, feat/d063-gitleaks-public-history, feat/d063-gitleaks-all-prs, feat/d159-native-gui-published-same-runtime, fix/d160-native-mac-strict-state, feat/d161-native-linux-same-runtime, feat/d162-native-3os-same-run, feat/d163-strict-live-plugin-state-contract, feat/d164-native-loopback-real-listeners, feat/d173-source-sdk-0144, feat/d171-daily-qa01-main-v2, feat/d168-pages-preflight-main, main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-git-history:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan public CI history with pinned redacting binary
        shell: bash
        run: |
          set -euo pipefail
          folder="$RUNNER_TEMP/d063-gitleaks"
          mkdir -m 700 -p "$folder/bin"
          trap 'rm -rf -- "$folder"' EXIT
          curl --fail --location --proto '=https' --tlsv1.2 --retry 2 --silent --show-error --output "$folder/pkg.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$folder/pkg.tar.gz" | sha256sum -c - >/dev/null
          tar -xzf "$folder/pkg.tar.gz" -C "$folder/bin" gitleaks
          "$folder/bin/gitleaks" version
          test "$(git rev-parse --is-shallow-repository)" = false
          git rev-list --all --count >/dev/null
          # On pull_request, explicitly include the detached merge HEAD as
          # well as all fetched refs. No report text or matching line emitted.
          set +e
          "$folder/bin/gitleaks" git . --log-opts='--all HEAD' --redact=100 --no-banner --log-level error --report-format json --report-path "$folder/findings.json" >"$folder/tool.stdout" 2>"$folder/tool.stderr"
          code=$?
          set -e
          node - "$folder/findings.json" <<'NODE'
          const fs=require('node:fs'), file=process.argv[2];
          if (!fs.existsSync(file)) { console.log('D063: no readable finding report; return code governs'); process.exit(0); }
          const v=JSON.parse(fs.readFileSync(file,'utf8'));
          if(!Array.isArray(v)) throw Error('Malformed scanner report');
          console.log('D063 redacted public-history finding count:', v.length);
          NODE
          if [ "$code" -ne 0 ]; then
            echo 'D063 public history scan did not pass; raw findings stay ephemeral, never uploaded.' >&2
            exit "$code"
          fi
          echo 'D063 full public CI Git history scanned; private IDE repo NOT scanned.'
