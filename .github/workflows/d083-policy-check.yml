name: D-083 public workflow minimum-security static gates
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [fix/d226-premerge-gates-after-d229, fix/d083-workflow-concurrency]
    paths: ['.github/workflows/**', 'scripts/d226-d083-policy.mjs']
  workflow_dispatch:
permissions: read-all
jobs:
  audit:
    if: github.repository == 'dol-1/suliko-ide-ci'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.19.0'
          package-manager-cache: false
      - name: Check ALL public workflow source contracts
        shell: bash
        run: |
          set -euo pipefail
          node scripts/d226-d083-policy.mjs --self-test
          node scripts/d226-d083-policy.mjs

