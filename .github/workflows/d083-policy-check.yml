name: D-083 public workflow minimum-security static gates
# D249 post-D242 exact-head: installed own-panel keyboard/focus and bounded category-only fixture diagnostics, no gate weakening.
# D247 exact D252 source premerge note: every required real hosted CI path, no auto-merge.
# D242 new-source SHA complete proof: 14 genuine impacted workflows, including D252 glossary.
# D242 exact D252-main 13-source-gate proof; source-only preview no publication.
# D252 exact-head: full 14-way own bilingual docs/SDK/QA/security/native evidence, no release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [feat/d249-keyboard-after-d242, feat/d247-premerge-post-d252, feat/d242-trust-after-d247, feat/d252-ka-en-glossary-lint, feat/d202-uninstall-after-d230, feat/d230-first15-after-d226, fix/d226-premerge-after-d227, fix/d083-workflow-concurrency, main]
    paths: ['.github/workflows/**', 'scripts/d226-d083-policy.mjs', 'scripts/d230-first15-metrics.mjs', 'scripts/d202-exact-head-gate.mjs']
  workflow_dispatch:
permissions: read-all
jobs:
  audit:
    if: github.repository == 'dol-1/suliko-ide-ci'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.19.0'
          package-manager-cache: false
      - name: Check ALL public workflow source contracts
        shell: bash
        run: |
          set -euo pipefail
          node scripts/d226-d083-policy.mjs --self-test
          node scripts/d226-d083-policy.mjs

