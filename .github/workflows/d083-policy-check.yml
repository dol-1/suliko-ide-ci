name: D-083 public workflow minimum-security static gates
# D251 after D252 main 14 true source gates; CycloneDX alone NEVER proves no advisory.
# D252 exact-head: full 14-way own bilingual docs/SDK/QA/security/native evidence, no release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [feat/d251-cyclonedx-post-d252, feat/d252-ka-en-glossary-lint, feat/d202-uninstall-after-d230, feat/d230-first15-after-d226, fix/d226-premerge-after-d227, fix/d083-workflow-concurrency, main]
    paths: ['.github/workflows/**', 'scripts/d226-d083-policy.mjs', 'scripts/d230-first15-metrics.mjs', 'scripts/d202-exact-head-gate.mjs']
  workflow_dispatch:
permissions: read-all
jobs:
  audit:
    if: github.repository == 'dol-1/suliko-ide-ci'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.19.0'
          package-manager-cache: false
      - name: Check ALL public workflow source contracts
        shell: bash
        run: |
          set -euo pipefail
          node scripts/d226-d083-policy.mjs --self-test
          node scripts/d226-d083-policy.mjs

