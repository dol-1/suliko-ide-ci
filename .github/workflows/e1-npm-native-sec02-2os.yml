name: D-155 actual published BB native three-OS SEC02 and own Hello (NO E1 release)
on:
  workflow_call:
  push:
    branches: [feat/d155-published-native-3os-sec02-hello, main]
    paths:
      - '.github/workflows/e1-npm-native-sec02-2os.yml'
      - 'scripts/d153-published-npm-sec02-native.mjs'
  workflow_dispatch:
concurrency:
  group: d153-npm-native-${{ github.ref }}
  cancel-in-progress: true
permissions: read-all
jobs:
  native-published-cli:
    if: github.repository == 'dol-1/suliko-ide-ci'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      CI: 'true'
      BB_TELEMETRY: 'false'
      BB_SERVER_BIND_HOST: '127.0.0.1'
      BB_SERVER_PORT: '39061'
      BB_HOST_DAEMON_PORT: '39062'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.19.0'
          package-manager-cache: false
      - name: Execute actual published BB native SEC02 disabled built-ins and local own Hello
        shell: bash
        run: |
          node scripts/d153-published-npm-sec02-native.mjs
          echo 'Actual published bb-app@0.49.0 live native 3OS SEC02 forbidden plugin disable + own local Hello active on synthetic loopback, independent publisher digest/user installer/RC not established.' >> "$GITHUB_STEP_SUMMARY"
