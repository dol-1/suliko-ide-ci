# OPS-01: only generated empty-data-dir fixture is transferred between fresh GitHub-hosted VMs.
# NEVER use production archives, owner data, provider tokens or secrets with this workflow.
name: OPS-01 two-host synthetic BB restore
on:
  push:
    branches: [feat/ops01-cross-runner]
    paths: ['.github/workflows/ops01-cross-runner.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export_runner:
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    outputs:
      archive_sha: \${{ steps.fixture.outputs.archive_sha }}
      source_host: \${{ steps.fixture.outputs.source_host }}
    env:
      CI: 'true'
      BB_TELEMETRY: 'false'
      BB_SERVER_BIND_HOST: '127.0.0.1'
      BB_SERVER_PORT: '38886'
      BB_HOST_DAEMON_PORT: '38889'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: get-bb/bb
          ref: desktop-v0.49.0
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.19.0'
          package-manager-cache: false
      - name: Verify stock BB tag and build
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "7b26cae79ec978fafd0a5db0e8517e94f12eb8f4"
          test "$(node -p 'require("./package.json").packageManager')" = "pnpm@9.15.0"
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
          pnpm install --frozen-lockfile
          pnpm run build
      - name: Create synthetic fixture and export
        id: fixture
        shell: bash
        timeout-minutes: 20
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/ops01-fixture-source"
          archive="$RUNNER_TEMP/ops01-fixture.tar.gz"
          test ! -e "$source_dir" && test ! -e "$archive"
          cleanup() {
            node packages/bb-app/dist/bb-app.js stop --data-dir "$source_dir" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          export BB_DATA_DIR="$source_dir"
          node packages/bb-app/dist/bb-app.js start --data-dir "$source_dir" --server-bind-host 127.0.0.1 --server-port 38886 --host-daemon-port 38889 --no-in-app-updates >"$RUNNER_TEMP/ops01-source.log" 2>&1 &
          ready=0
          for i in $(seq 1 45); do
            if node packages/bb-app/dist/bb.js settings show --json >/dev/null 2>&1; then ready=1; break; fi
            sleep 2
          done
          test "$ready" = 1 || { echo "Source loopback not ready"; tail -60 "$RUNNER_TEMP/ops01-source.log"; exit 1; }
          node packages/bb-app/dist/bb.js settings experiment serverMove true >/dev/null
          node packages/bb-app/dist/bb.js server export --out "$archive" >/dev/null
          test -s "$archive"
          echo "archive_sha=$(sha256sum "$archive" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "source_host=$(hostname)" >> "$GITHUB_OUTPUT"
          echo "Only a freshly generated, anonymous BB fixture archive was exported." >> "$GITHUB_STEP_SUMMARY"
      - name: Transfer synthetic-only archive (one day retention)
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ops01-anonymous-fixture
          path: \${{ runner.temp }}/ops01-fixture.tar.gz
          retention-days: 1
          if-no-files-found: error
      - name: Remove archive on exporter
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/ops01-fixture.tar.gz"

  import_runner:
    needs: export_runner
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    env:
      CI: 'true'
      BB_TELEMETRY: 'false'
      BB_SERVER_BIND_HOST: '127.0.0.1'
      BB_SERVER_PORT: '38886'
      BB_HOST_DAEMON_PORT: '38889'
      EXPECTED_ARCHIVE_SHA: \${{ needs.export_runner.outputs.archive_sha }}
      SOURCE_HOST: \${{ needs.export_runner.outputs.source_host }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: get-bb/bb
          ref: desktop-v0.49.0
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.19.0'
          package-manager-cache: false
      - name: Download source-runner synthetic archive
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ops01-anonymous-fixture
          path: incoming
      - name: Verify source provenance and build stock BB afresh
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "7b26cae79ec978fafd0a5db0e8517e94f12eb8f4"
          test "$(node -p 'require("./package.json").packageManager')" = "pnpm@9.15.0"
          test -n "$EXPECTED_ARCHIVE_SHA"
          test "$SOURCE_HOST" != "$(hostname)" || { echo "Unexpected same host identifier"; exit 1; }
          printf '%s  %s\n' "$EXPECTED_ARCHIVE_SHA" "incoming/ops01-fixture.tar.gz" | sha256sum -c -
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
          pnpm install --frozen-lockfile
          pnpm run build
      - name: Offline import onto new VM and real restored server assertion
        shell: bash
        timeout-minutes: 20
        run: |
          set -euo pipefail
          restore_dir="$RUNNER_TEMP/ops01-second-runner"
          test ! -e "$restore_dir"
          cleanup() {
            node packages/bb-app/dist/bb-app.js stop --data-dir "$restore_dir" >/dev/null 2>&1 || true
            rm -f incoming/ops01-fixture.tar.gz
          }
          trap cleanup EXIT
          node packages/bb-app/dist/bb.js server import incoming/ops01-fixture.tar.gz --data-dir "$restore_dir" --yes >/dev/null
          test -s "$restore_dir/bb.db"
          export BB_DATA_DIR="$restore_dir"
          node packages/bb-app/dist/bb-app.js start --data-dir "$restore_dir" --server-bind-host 127.0.0.1 --server-port 38886 --host-daemon-port 38889 --no-in-app-updates >"$RUNNER_TEMP/ops01-second-start.log" 2>&1 &
          ready=0
          for i in $(seq 1 45); do
            if node packages/bb-app/dist/bb.js settings show --json >"$RUNNER_TEMP/ops01-second-settings.json" 2>/dev/null; then ready=1; break; fi
            sleep 2
          done
          test "$ready" = 1 || { echo "Second-runner restored loopback not ready"; tail -60 "$RUNNER_TEMP/ops01-second-start.log"; exit 1; }
          node -e 'const s=require(process.argv[1]); if(s.experiments?.serverMove !== true && s.config?.experiments?.serverMove !== true) throw Error("Restored source fixture missing on second runner")' "$RUNNER_TEMP/ops01-second-settings.json"
          echo "Two distinct GitHub-hosted Linux VMs: source $(printf '%s' "$SOURCE_HOST" | cut -c1-80), restore $(hostname). Stock BB import and synthetic setting verified. Not production recovery." >> "$GITHUB_STEP_SUMMARY"
