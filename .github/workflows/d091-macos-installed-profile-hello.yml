name: D-091 macOS official DMG user-app and separate stock CLI live SEC02 Hello (PARTIAL E1)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [feat/d091-macos-installed-profile-hello, feat/d135-macos-official-installed-hello]
    paths:
      - '.github/workflows/d091-macos-installed-profile-hello.yml'
      - 'scripts/verify-hardened.sh'
      - 'config/hardened/.env.hardened'
      - 'plugins/suliko-hello/**'
      - 'tests/parity/d135-macos-official-installed-hello.mjs'
      - 'scripts/suliko-setup.sh'
      - 'scripts/d058-stage-portable.mjs'
  workflow_dispatch:
permissions: read-all
jobs:
  macos-arm64-user:
    if: github.repository == 'dol-1/suliko-ide-ci'
    runs-on: macos-15
    timeout-minutes: 95
    env:
      CI: 'true'
      BB_TELEMETRY: 'false'
      BB_SERVER_BIND_HOST: '127.0.0.1'
      BB_SERVER_PORT: '38914'
      BB_HOST_DAEMON_PORT: '38915'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: get-bb/bb
          ref: desktop-v0.49.0
          path: stock-bb
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.19.0'
          package-manager-cache: false
      - name: Build immutable stock CLI in disposable runner (separate from official signed app)
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C stock-bb rev-parse HEAD)" = "7b26cae79ec978fafd0a5db0e8517e94f12eb8f4"
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
          (cd stock-bb && pnpm install --frozen-lockfile && pnpm run build)
          test -s stock-bb/packages/bb-app/dist/bb-app.js
      - name: Install test-only pinned Playwright Electron harness
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix tests/parity install --no-save --no-package-lock --no-audit --no-fund '@playwright/test@1.56.0'
      - name: Official fixed-SHA DMG mount, user-app install, code-sign check, GUI liveness and cleanup
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$(id -u)" -ne 0
          test "$(uname -m)" = arm64
          export HOME="$RUNNER_TEMP/d084-mac-user-home"
          export BB_DATA_DIR="$HOME/bb-disposable"
          mkdir -m 700 -p "$HOME" "$HOME/Applications" "$BB_DATA_DIR"
          mount="$RUNNER_TEMP/d084-mac-readonly-mount"
          mkdir -m 700 -p "$mount"
          pid=""
          mounted=0
          cleanup() {
            set +e
            if [[ -n "$pid" ]]; then
              kill -TERM "$pid" >/dev/null 2>&1
              sleep 2
              kill -KILL "$pid" >/dev/null 2>&1
              wait "$pid" >/dev/null 2>&1
            fi
            node stock-bb/packages/bb-app/dist/bb-app.js stop --data-dir "$BB_DATA_DIR" >/dev/null 2>&1 || true
            if [[ "$mounted" = 1 ]]; then hdiutil detach -quiet "$mount" >/dev/null 2>&1; fi
            # Only the exact disposable user-owned path can be removed.
            [[ ! -d "$HOME/Applications/bb.app" ]] || rm -rf -- "$HOME/Applications/bb.app"
            HOME="$HOME" bash scripts/suliko-setup.sh --uninstall >/dev/null 2>&1
          }
          trap cleanup EXIT
          start="$(date +%s)"
          bash scripts/suliko-setup.sh --download-verified >/dev/null
          dmg="$HOME/.cache/suliko-ide/bb-0.49.0-arm64.dmg"
          test -s "$dmg" && test ! -L "$dmg"
          printf '%s  %s\n' '5bebb0b635c1c8b14e549fe3799152d8a6375bb2e8259be328897e1906f63e17' "$dmg" | shasum -a 256 -c - >/dev/null
          hdiutil attach -readonly -nobrowse -quiet -mountpoint "$mount" "$dmg"
          mounted=1
          source_app="$(find "$mount" -maxdepth 2 -type d -name 'bb.app' -print -quit)"
          if [[ -z "$source_app" || -L "$source_app" ]]; then
            echo 'Official DMG did not have the expected bb.app bundle; fail closed.' >&2; exit 1
          fi
          app="$HOME/Applications/bb.app"
          test ! -e "$app" && test ! -L "$app"
          # Do not suppress source quarantine metadata or bypass Gatekeeper.
          ditto "$source_app" "$app"
          executable="$app/Contents/MacOS/bb"
          test -x "$executable" && test ! -L "$executable"
          codesign --verify --deep --strict "$app" >/dev/null 2>&1 ||
            { echo 'Official BB app signature verification failed; do not launch.' >&2; exit 1; }
          spctl --assess --type execute "$app" >/dev/null 2>&1 ||
            { echo 'Official BB app rejected by macOS execution policy; refusing launch.' >&2; exit 1; }
          # Explicitly execute the official copied app as an unprivileged user;
          # no root, remote service, provider token, persistent account or system install.
          "$executable" >"$RUNNER_TEMP/d084-mac-window.log" 2>&1 &
          pid=$!
          sleep 15
          kill -0 "$pid" 2>/dev/null ||
            { echo 'macOS copied BB app did not remain alive for the 15s smoke.' >&2; exit 1; }
          kill -TERM "$pid" >/dev/null 2>&1 || true
          wait "$pid" >/dev/null 2>&1 || true
          pid=""
          # Actual live stock bb-app pinned source CLI; this does not certify
          # that the installed DMG embeds the same plugin CLI configuration.
          # Only test-owned DATA dir under fresh runner-temp HOME.
          mkdir -p "$RUNNER_TEMP/d091-macos-bin"
          cat >"$RUNNER_TEMP/d091-macos-bin/bb" <<'WRAPPER'
          #!/usr/bin/env bash
          exec node "$GITHUB_WORKSPACE/stock-bb/packages/bb-app/dist/bb.js" "$@"
          WRAPPER
          chmod 700 "$RUNNER_TEMP/d091-macos-bin/bb"
          export PATH="$RUNNER_TEMP/d091-macos-bin:$PATH"
          node stock-bb/packages/bb-app/dist/bb-app.js start --data-dir "$BB_DATA_DIR" \
            --server-bind-host 127.0.0.1 --server-port 38914 --host-daemon-port 38915 \
            --no-in-app-updates >"$RUNNER_TEMP/d091-macos-server.log" 2>&1 &
          ready=0
          for i in $(seq 1 45); do
            if bb plugin list --json >"$RUNNER_TEMP/d091-macos-plugins.json" 2>/dev/null; then ready=1; break; fi
            sleep 2
          done
          test "$ready" = 1 || { echo 'D091 macOS disposable live stock bb-app unavailable'; exit 1; }
          node - "$RUNNER_TEMP/d091-macos-plugins.json" <<'NODE' >"$RUNNER_TEMP/d091-macos-forbidden.txt"
          const fs=require('node:fs'),v=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(!Array.isArray(v.plugins))throw Error('Invalid plugin list');
          const forbidden=new Set(['bb--mcp','account-pool','connect','bb--connect-next','memory']);
          for(const x of v.plugins)if(forbidden.has(x.id)&&x.enabled===true)console.log(x.id);
          NODE
          while IFS= read -r plugin; do
            [[ -n "$plugin" ]] || continue
            bb plugin disable "$plugin" >/dev/null
          done <"$RUNNER_TEMP/d091-macos-forbidden.txt"
          bb plugin install ./plugins/suliko-hello --yes >/dev/null
          bb plugin list --json >"$RUNNER_TEMP/d091-macos-hello.json"
          node - "$RUNNER_TEMP/d091-macos-hello.json" <<'NODE'
          const fs=require('node:fs'),v=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const own=v.plugins?.filter(p=>p.id==='suliko-hello'||p.id==='bb-plugin-suliko-hello');
          if(own?.length!==1||own[0].enabled!==true)throw Error('Hello is not active in actual disposable BB');
          console.log('D091 macOS live own Hello enabled on loopback');
          NODE
          bash scripts/verify-hardened.sh
          # D135: test genuine installed official signed bb.app GUI own Hello,
          # after the separate immutable same-source CLI enabled the plugin.
          project="$HOME/d135-macos-synthetic"
          mkdir -m 700 -p "$project"
          printf '%s\n' 'Disposable project only' > "$project/README.md"
          git -C "$project" init -b main >/dev/null
          git -C "$project" add README.md
          bb project create --name d135-macos-synthetic --root "$project" >/dev/null
          export D135_OFFICIAL_EXE="$executable"
          export D135_BB_WEB_URL='http://127.0.0.1:38914/'
          node tests/parity/d135-macos-official-installed-hello.mjs
          # The tests explicitly use only an isolated loopback pair; inspect
          # actual connected listeners, not a successful config parse alone.
          lsof -nP -iTCP:38914 -sTCP:LISTEN >"$RUNNER_TEMP/d091-macos-38914" || { echo 'No BB loopback server listener'; exit 1; }
          lsof -nP -iTCP:38915 -sTCP:LISTEN >"$RUNNER_TEMP/d091-macos-38915" || { echo 'No daemon listener'; exit 1; }
          grep -q '127.0.0.1:38914' "$RUNNER_TEMP/d091-macos-38914"
          grep -q '127.0.0.1:38915' "$RUNNER_TEMP/d091-macos-38915"
          node stock-bb/packages/bb-app/dist/bb-app.js stop --data-dir "$BB_DATA_DIR" >/dev/null
          hdiutil detach -quiet "$mount"
          mounted=0
          rm -rf -- "$app"
          bash scripts/suliko-setup.sh --uninstall >/dev/null
          test ! -e "$app" && test ! -e "$dmg"
          elapsed="$(($(date +%s)-start))"
          echo "MACOS_INSTALL_ELAPSED_SECONDS=$elapsed" >> "$GITHUB_STEP_SUMMARY"
          echo 'D135 macOS official signed DMG user-app genuine Hello Electron panel + separate live stock CLI SEC02/Hello and owned cleanup; no immutable RC marketplace, 3OS user installer or beta GO.' >> "$GITHUB_STEP_SUMMARY"
          test "$elapsed" -lt 900
