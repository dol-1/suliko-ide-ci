name: D-065 source-only beta release preview (NOT published)
on:
  push:
    branches: [feat/d065-source-preview, main]
    paths: ['scripts/d065-*', '.github/workflows/d065-preview.yml', 'plugins/**', 'marketplace/marketplace.json']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.19.0'
      - run: node --test scripts/d065-source-preview.test.mjs
      - name: Compute reproducible hash manifest in ephemeral runner temp ONLY
        shell: bash
        run: |
          set -euo pipefail
          test ! -e "$RUNNER_TEMP/d065-preview.json"
          node scripts/d065-source-preview.mjs "$RUNNER_TEMP/d065-preview.json"
          node - "$RUNNER_TEMP/d065-preview.json" <<'NODE'
          const fs=require("node:fs"), x=JSON.parse(fs.readFileSync(process.argv[2],"utf8"));
          if(x.status!=="not-released"||!x.source_only||x.attested||x.complete_sbom||x.files.length<5)throw Error("Preview falsely claims release, bundle or full SBOM");
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,"D065 deterministic source-only preview hash: "+x.manifest_sha256+"\nNo release/tag/asset/artifact/SBOM/attestation was created.\n");
          NODE
          rm -f -- "$RUNNER_TEMP/d065-preview.json"
