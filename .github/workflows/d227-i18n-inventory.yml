name: D-227 own plugins complete KA EN translation inventory (NO beta)
on:
  push:
    branches: [feat/d227-i18n-visual-two-viewports]
    paths:
      - 'scripts/d227-i18n-inventory.mjs'
      - 'plugins/suliko-hello/i18n.ts'
      - 'plugins/suliko-remote-panel/i18n.ts'
      - '.github/workflows/d227-i18n-inventory.yml'
concurrency:
  group: d227-i18n-${{ github.ref }}
  cancel-in-progress: true
permissions: read-all
jobs:
  inventory:
    if: github.repository == 'dol-1/suliko-ide-ci'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.19.0'
          package-manager-cache: false
      - name: Full bilingual key inventory and negative source fixtures
        run: |
          node scripts/d227-i18n-inventory.mjs --self-test
          node scripts/d227-i18n-inventory.mjs
      - name: Retain no-text key-only artifact for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: d227-own-i18n-keys
          path: out/d227/translation-keys.json
          retention-days: 7
          if-no-files-found: error
