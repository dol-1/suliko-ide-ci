# D-042 extra stock BB verification. No tests disabled, no BB source edits.
name: SPIKE-01 stock BB unskipped tests with 30s timeout
on:
  push:
    branches: [feat/d042-stock-test-timeout]
    paths: ['.github/workflows/spike01-extended-timeout.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stock-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      BB_TELEMETRY: 'false'
      BB_SERVER_BIND_HOST: '127.0.0.1'
      CI: 'true'
    steps:
      - name: Checkout frozen upstream BB source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: get-bb/bb
          ref: desktop-v0.49.0
          persist-credentials: false
      - name: Verify immutable source and package manager
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = '7b26cae79ec978fafd0a5db0e8517e94f12eb8f4'
          test "$(node -p 'require("./package.json").packageManager')" = 'pnpm@9.15.0'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.19.0'
          package-manager-cache: false
      - name: Install, build and typecheck unmodified BB
        shell: bash
        timeout-minutes: 55
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
          pnpm install --frozen-lockfile
          pnpm run build
          pnpm run typecheck
      - name: Run ALL stock upstream tests with Vitest timeout 30000ms
        shell: bash
        timeout-minutes: 30
        run: |
          set -euo pipefail
          mkdir -p evidence
          set -o pipefail
          pnpm exec turbo run test -- --testTimeout=30000 2>&1 | tee evidence/test-30s.log
      - name: Preserve unskipped upstream test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bb-0490-stock-vitest-timeout-30s
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
