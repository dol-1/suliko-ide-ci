name: D-210 daily BB upstream stable release vs pinned 0.49.0 (ISSUE DRAFT ONLY)
on:
  push:
    branches: [feat/d210-upstream-review-after-d206]
    paths:
      - '.github/workflows/d210-bb-release-watch.yml'
      - 'scripts/d210-bb-release-watch.mjs'
      - 'docs/ops/BB-UPGRADE-RUNBOOK.md'
  schedule:
    - cron: '41 12 * * *'
concurrency:
  group: d210-upstream-${{ github.ref }}
  cancel-in-progress: true
permissions: read-all
jobs:
  official-stable-readonly:
    if: github.repository == 'dol-1/suliko-ide-ci'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.19.0'
          package-manager-cache: false
      - name: Strict negative fixtures and read-only official GitHub stable release metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/d210-bb-release-watch.mjs --self-test
          gh api /repos/get-bb/bb/releases/latest | node scripts/d210-bb-release-watch.mjs
      - name: Upload bounded source-only review artifact; never create an issue
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: d210-bb-upstream-review
          path: out/d210/
          retention-days: 7
          if-no-files-found: error
