name: D-060 synthetic loopback-only Remote read contract
on:
  push:
    branches: [feat/d060-remote-loopback-reader, main]
    paths:
      - '.github/workflows/d060-loopback-mock.yml'
      - 'plugins/suliko-remote-panel/loopback-test-reader.ts'
      - 'plugins/suliko-remote-panel/loopback-test-reader.test.ts'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  loopback:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: 'true'
      BB_TELEMETRY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.19.0'
          package-manager-cache: false
      - name: Exact pinned own MOCK dependency graph and tests
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
          cd plugins/suliko-remote-panel
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm run typecheck
          pnpm run test
      - name: No real Remote boundary
        if: success()
        run: |
          echo 'D060 disposable 127.0.0.1 HTTP GET fixture only; no real Remote, tokens, approval mutations, Desktop/Web runtime connection or beta claim.' >> "$GITHUB_STEP_SUMMARY"
