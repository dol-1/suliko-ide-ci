name: D-252 own KA EN docs and UI canonical glossary lint
# D242 docs trust source must also run the unchanged D252 canonical glossary gate.
# D252 exact-head: full 14-way own bilingual docs/SDK/QA/security/native evidence, no release.
on:
  push:
    branches: [feat/d242-trust-post-d252, feat/d252-ka-en-glossary-lint, main]
    paths:
      - 'docs/terms/d252-ka-en-glossary.json'
      - 'scripts/d252-glossary-lint.mjs'
      - 'scripts/d252-glossary-lint.test.mjs'
      - 'plugins/suliko-hello/i18n.ts'
      - 'plugins/suliko-remote-panel/i18n.ts'
      - 'site/docs/**'
      - '.github/workflows/d252-glossary-lint.yml'
  workflow_dispatch:
concurrency:
  group: d252-terms-${{ github.ref }}
  cancel-in-progress: true
permissions: read-all
jobs:
  terms:
    if: github.repository == 'dol-1/suliko-ide-ci'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.19.0'
          package-manager-cache: false
      - name: Reject inconsistent terms with fixtures and exact own docs
        run: |
          node --test scripts/d252-glossary-lint.test.mjs
          node scripts/d252-glossary-lint.mjs
