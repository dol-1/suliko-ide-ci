name: D-141 Windows one-command user install + official installed Hello and SEC02 (PARTIAL)
concurrency:
  group: e1-user-windows-${{ github.ref }}
  cancel-in-progress: true
on:
  workflow_call:
  push:
    branches: [feat/d202-uninstall-after-d230, feat/d141-windows-one-command-stage]
    paths:
      - 'scripts/d202-exact-head-gate.mjs'
      - '.github/workflows/e1-windows-one-command.yml'
      - 'tests/parity/d129-windows-installed-desktop.mjs'
      - 'scripts/suliko-setup.ps1'
  workflow_dispatch:
permissions: read-all
jobs:
  windows-x64-nonadmin:
    if: github.repository == 'dol-1/suliko-ide-ci'
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      CI: 'true'
      BB_TELEMETRY: 'false'
      BB_SERVER_BIND_HOST: '127.0.0.1'
      BB_SERVER_PORT: '38895'
      BB_HOST_DAEMON_PORT: '38896'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: get-bb/bb
          ref: desktop-v0.49.0
          path: stock-bb
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.19.0'
          package-manager-cache: false
      # D130 exact Windows-2025 public GH 43569139827 established that
      # CI-temporary pinned node-gyp 13.1 handles VS2026 native stock BB build
      # without changing upstream source or pnpm frozen lock. Restore the
      # official installed GUI+SEC02/Hello assertions on windows-2025.
      # This is NOT three-OS one-command E1 or tagged RC acceptance.
      - name: Compile immutable stock CLI for disposable E1 SEC02 checks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git -C stock-bb rev-parse HEAD).Trim() -cne '7b26cae79ec978fafd0a5db0e8517e94f12eb8f4') { throw 'D126 upstream source mismatch' }
          # Bounded build-tool compatibility workaround in disposable RUNNER_TEMP;
          # no node-gyp or source/lockfile modifications inside stock-bb.
          $gypRoot = Join-Path $env:RUNNER_TEMP 'd133-node-gyp'
          npm --prefix $gypRoot install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund 'node-gyp@13.1.0'
          if ($LASTEXITCODE -ne 0) { throw 'D133 pinned CI toolchain install failed' }
          $gyp = Join-Path $gypRoot 'node_modules/node-gyp/bin/node-gyp.js'
          if (-not (Test-Path -LiteralPath $gyp -PathType Leaf)) { throw 'D133 pinned node-gyp script missing' }
          if ((& node $gyp --version).Trim() -cne 'v13.1.0') { throw 'D133 node-gyp version drift' }
          # Environment is scoped to this PowerShell job step; D130 proved
          # pnpm 9.15 lifecycle honors explicit npm_config_node_gyp here.
          $env:npm_config_node_gyp = $gyp
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
          pnpm --dir stock-bb install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'D126 pinned install failed' }
          pnpm --dir stock-bb run build
          if ($LASTEXITCODE -ne 0) { throw 'D126 pinned build failed' }
      - name: Install pinned Electron Playwright harness inside disposable public CI fixture
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          npm --prefix tests/parity install --no-save --no-package-lock --no-audit --no-fund '@playwright/test@1.56.0'
          if ($LASTEXITCODE -ne 0) { throw 'D129 pinned Playwright test dependency missing' }
      - name: Official fixed-SHA NSIS per-user install + real installed own Hello panel and cleanup
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          if ($env:PROCESSOR_ARCHITECTURE -ne 'AMD64') { throw 'Only x64 runner allowed' }
          $runnerTemp = [IO.Path]::GetFullPath($env:RUNNER_TEMP)
          if ([string]::IsNullOrWhiteSpace($runnerTemp) -or $runnerTemp -match '[\x00-\x1f"]') { throw 'Unsafe temporary root' }
          $work = Join-Path $runnerTemp 'd084-windows-synthetic-user'
          $env:USERPROFILE = Join-Path $work 'Profile'
          $env:LOCALAPPDATA = Join-Path $work 'LocalAppData'
          $env:APPDATA = Join-Path $work 'RoamingAppData'
          $env:BB_DATA_DIR = Join-Path $work 'bb-disposable'
          foreach ($dir in @($env:USERPROFILE, $env:LOCALAPPDATA, $env:APPDATA, $env:BB_DATA_DIR)) {
            New-Item -ItemType Directory -Path $dir -Force | Out-Null
          }
          $target = Join-Path $env:LOCALAPPDATA 'SulikoIDE/InstalledBB'
          if ($target -match '\s|"') { throw 'NSIS /D target cannot contain whitespace or quotes' }
          if (Test-Path -LiteralPath $target) { throw 'Target must not preexist' }
          $process = $null
          $installed = $false
          $watch = [Diagnostics.Stopwatch]::StartNew()
          # Explicit refusal must precede any unsigned asset execution or install.
          $refused = $false
          try { & ./scripts/suliko-setup.ps1 -Install *> $null } catch { $refused = $true }
          if (-not $refused) { throw 'Unsigned Windows install unexpectedly accepted without explicit opt-in' }
          try {
            # SINGLE user-facing entry; source CLI below is an explicitly
            # separate test fixture, not represented as part of this installer.
            & ./scripts/suliko-setup.ps1 -Install -AllowUnsignedVerified | Out-Null
            $installer = Join-Path $env:LOCALAPPDATA 'SulikoIDE/Cache/bb-0.49.0-x64.exe'
            $app = Join-Path $target 'bb.exe'
            $ownerMarker = Join-Path $env:LOCALAPPDATA 'SulikoIDE/.suliko-installed-bb-0.49.0-x64.sha256'
            if (-not (Test-Path -LiteralPath $installer -PathType Leaf) -or
                -not (Test-Path -LiteralPath $app -PathType Leaf) -or
                -not (Test-Path -LiteralPath $ownerMarker -PathType Leaf)) {
              throw 'One-command Windows install missing verified cache, executable or ownership record'
            }
            $installed = $true
            # D129 launches the *actual official installed* bb.exe through
            # Playwright Electron after stock source CLI + Hello is mounted.
            # A second ordinary bb.exe would break Electron single-instance lock.
            # CI-only stock source CLI bound to the same synthetic data directory.
            # The actual official GUI is asserted by genuine Playwright below.
            $appCli = 'stock-bb/packages/bb-app/dist/bb-app.js'
            $bbCli = 'stock-bb/packages/bb-app/dist/bb.js'
            $daemon = Start-Process -FilePath 'node' -ArgumentList @($appCli,'start','--data-dir',$env:BB_DATA_DIR,'--server-bind-host','127.0.0.1','--server-port','38895','--host-daemon-port','38896','--no-in-app-updates') -PassThru
            try {
              $ready = $false
              for ($i=0; $i -lt 45; $i++) {
                Start-Sleep -Seconds 2
                $json = & node $bbCli plugin list --json 2>$null
                if ($LASTEXITCODE -ne 0) { continue }
                try { $parsed = ConvertFrom-Json -InputObject ($json -join "`n") -ErrorAction Stop } catch { continue }
                if ($null -ne $parsed.plugins) { $ready = $true; break }
              }
              if (-not $ready) { throw 'D126 stock CLI not ready' }
              foreach ($id in @('account-pool','bb--mcp','connect','bb--connect-next','memory')) {
                $found = @($parsed.plugins | Where-Object { $_.id -ceq $id })
                if ($found.Count -gt 1) { throw 'D126 ambiguous forbidden ID' }
                # Some stock plugins report enabled=false but a distinct
                # non-disabled status (e.g. configuration-needed). Explicitly
                # request a disable for *all* non-converged forbidden records;
                # never treat enabled=false alone as acceptance.
                if ($found.Count -eq 1 -and ($found[0].enabled -ne $false -or $found[0].status -cne 'disabled')) {
                  & node $bbCli plugin disable $id *> $null
                  if ($LASTEXITCODE -ne 0) { throw "D126 explicit disable refused for reviewed forbidden ID $id" }
                }
              }
              & node $bbCli plugin install ./plugins/suliko-hello --yes *> $null
              if ($LASTEXITCODE -ne 0) { throw 'D126 own plugin install failed' }
              # D157: disabled state must be observed from the *real* stock
              # CLI. Bounded consistency retries tolerate asynchronous plugin
              # persistence without accepting missing/unsafe status or skips.
              $stateAccepted = $false
              $lastSafeState = 'unavailable'
              for ($stateAttempt=0; $stateAttempt -lt 10; $stateAttempt++) {
                $json = & node $bbCli plugin list --json 2>$null
                if ($LASTEXITCODE -ne 0) { $lastSafeState = 'cli-unavailable'; Start-Sleep -Seconds 1; continue }
                try { $parsed = ConvertFrom-Json -InputObject ($json -join "`n") -ErrorAction Stop }
                catch { $lastSafeState = 'invalid-json'; Start-Sleep -Seconds 1; continue }
                if ($null -eq $parsed.plugins) { $lastSafeState = 'no-plugins'; Start-Sleep -Seconds 1; continue }
                $allDisabled = $true
                foreach ($id in @('account-pool','bb--mcp','connect','bb--connect-next','memory')) {
                  $found = @($parsed.plugins | Where-Object { $_.id -ceq $id })
                  if ($found.Count -gt 1) { throw 'D126 ambiguous forbidden ID' }
                  if ($found.Count -eq 1 -and ($found[0].enabled -ne $false -or $found[0].status -cne 'disabled')) {
                    $allDisabled = $false
                    $safeEnabled = if ($found[0].enabled -eq $true) { 'true' } elseif ($found[0].enabled -eq $false) { 'false' } else { 'other' }
                    $safeStatus = switch -CaseSensitive ([string]$found[0].status) {
                      'disabled' { 'disabled' }
                      'enabled' { 'enabled' }
                      'installed' { 'installed' }
                      default { 'other' }
                    }
                    $lastSafeState = "forbidden-$id-enabled-$safeEnabled-status-$safeStatus"
                  }
                }
                $hello = @($parsed.plugins | Where-Object { $_.id -ceq 'suliko-hello' })
                if ($hello.Count -gt 1) { throw 'D126 duplicate own Hello ID' }
                if ($allDisabled -and $hello.Count -eq 1 -and $hello[0].enabled -eq $true) { $stateAccepted = $true; break }
                if ($hello.Count -ne 1 -or $hello[0].enabled -ne $true) { $lastSafeState = 'hello-not-enabled' }
                Start-Sleep -Seconds 1
              }
              if (-not $stateAccepted) {
                Write-Output "D126_STRICT_SEC02_NOT_CONFIRMED category=$lastSafeState"
                throw 'D126 unsafe stock plugin state'
              }
              $profile = Get-Content -LiteralPath 'config/hardened/.env.hardened'
              if ('BB_SERVER_BIND_HOST=127.0.0.1' -cnotin $profile -or 'BB_TELEMETRY=false' -cnotin $profile) { throw 'D126 SEC02 contract drift' }
              Write-Output 'D129_REAL_CLI_SEC02_HELLO_ENABLED=PASS; official UI check next'
              # Genuine Windows installed app, no source-built Desktop substitute.
              # Stock BB own panels are project-scoped; enroll one real
              # synthetic local project before launching installed Desktop UI.
              $project = Join-Path $work 'd129-win-synthetic'
              New-Item -ItemType Directory -Path $project -Force | Out-Null
              'Disposable project only' | Set-Content -LiteralPath (Join-Path $project 'README.md') -Encoding utf8
              & git -C $project init -b main *> $null
              if ($LASTEXITCODE -ne 0) { throw 'D129 synthetic git init failed' }
              & git -C $project add README.md *> $null
              if ($LASTEXITCODE -ne 0) { throw 'D129 synthetic file staging failed' }
              & node $bbCli project create --name d129-win-synthetic --root $project *> $null
              if ($LASTEXITCODE -ne 0) { throw 'D129 real synthetic BB project enrollment failed' }
              $env:D129_OFFICIAL_EXE = $app
              $env:D129_BB_WEB_URL = 'http://127.0.0.1:38895/'
              & node tests/parity/d129-windows-installed-desktop.mjs
              if ($LASTEXITCODE -ne 0) { throw 'D129 official installed Windows Hello panel mount failed' }
              Write-Output 'D129_OFFICIAL_INSTALLED_WINDOWS_HELLO_PANEL=PASS'
            } finally {
              try { & node $appCli stop --data-dir $env:BB_DATA_DIR *> $null } catch {}
              if ($null -ne $daemon) { try { if (-not $daemon.HasExited) { $daemon.Kill($true); $daemon.WaitForExit(10000) | Out-Null } } catch {} }
            }
            # Official installed child GUI is closed by Playwright's own
            # finally, with actual 15s liveness enforced before test returns.
            # Single matching user entry removes only exact owned installation
            # and pinned Suliko cache; no BB account or provider data touched.
            & ./scripts/suliko-setup.ps1 -Uninstall | Out-Null
            if (Test-Path -LiteralPath $app -PathType Leaf) { throw 'Owned official bb.exe persisted after uninstall' }
            if (Test-Path -LiteralPath $installer -PathType Leaf) { throw 'Owned pinned installer cache persisted' }
            if (Test-Path -LiteralPath $ownerMarker -PathType Leaf) { throw 'Owned marker persisted after uninstall' }
            $watch.Stop()
            $elapsed = [int][Math]::Ceiling($watch.Elapsed.TotalSeconds)
            "WINDOWS_INSTALL_ELAPSED_SECONDS=$elapsed" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            'D141 Windows -Install -AllowUnsignedVerified/-Uninstall real official installed bb.exe Hello UI + separate stock-source CLI SEC02/Hello under 900s; NOT integrated user-safe 3OS, tag RC or beta GO.' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            if ($elapsed -ge 900) { throw 'Windows install exceeded 15 minutes' }
          } finally {
            if ($null -ne $process) {
              try { if (-not $process.HasExited) { $process.Kill($true); $process.WaitForExit(10000) | Out-Null } } catch {}
            }
            # Only our exact fresh hosted-runner temp tree, never user/system files.
            if (Test-Path -LiteralPath $work) { Remove-Item -LiteralPath $work -Recurse -Force -ErrorAction SilentlyContinue }
          }
