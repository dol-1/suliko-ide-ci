name: D-159 native installed official GUI plus real published CLI same host (NO E1 release)
on:
  push:
    branches: [feat/d202-uninstall-after-d230, feat/d159-native-gui-published-same-runtime, fix/d160-native-mac-strict-state, main]
    paths:
      - 'scripts/d202-exact-head-gate.mjs'
      - '.github/workflows/d159-installed-gui-published-native.yml'
      - 'scripts/d159-installed-gui-published-native.mjs'
      - 'scripts/d159-installed-gui-published-native.test.mjs'
      - 'scripts/suliko-setup.sh'
      - 'scripts/suliko-setup.ps1'
      - 'plugins/suliko-hello/**'
      - 'tests/parity/d129-windows-installed-desktop.mjs'
      - 'tests/parity/d135-macos-official-installed-hello.mjs'
  workflow_dispatch:
concurrency:
  group: d159-native-published-gui-${{ github.ref }}
  cancel-in-progress: true
permissions: read-all
jobs:
  native-same-synthetic-runtime:
    if: github.repository == 'dol-1/suliko-ide-ci'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      CI: 'true'
      BB_TELEMETRY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.19.0'
          package-manager-cache: false
      - name: Install pinned CI-only Playwright harness (not installer provisioning)
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix tests/parity install --no-save --no-package-lock --no-audit --no-fund '@playwright/test@1.56.0'
      - name: Require fail-closed non-CI / wrong-repository guard before accessing fixtures
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/d159-installed-gui-published-native.test.mjs
      - name: Real official per-user installed Electron GUI with published BB CLI live on SAME synthetic BB data
        shell: bash
        run: |
          set -euo pipefail
          node scripts/d159-installed-gui-published-native.mjs
          echo 'No end-user 3OS one-command configured marketplace/RC; no beta/security clearance.' >> "$GITHUB_STEP_SUMMARY"
