name: D-064 real published upstream SDK compile matrix (NON-RELEASE)
on:
  push:
    branches: [feat/d064-real-sdk-matrix, main]
    paths:
      - .github/workflows/d064-sdk-matrix.yml
      - plugins/suliko-hello/**
      - plugins/suliko-remote-panel/**
  schedule:
    - cron: '41 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  plugin-sdk-context:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        sdk: [pinned, upstream-main]
    env:
      SDK_CONTEXT: ${{ matrix.sdk }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.19.0'
      - name: Fetch upstream main SHA and SDK manifest (read only)
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
          curl --fail --silent --show-error --retry 2 --max-time 30 -H 'Accept: application/vnd.github+json' \
            https://api.github.com/repos/get-bb/bb/branches/main > "$RUNNER_TEMP/bb-main-ref.json"
          MAIN_SHA="$(node -p 'JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).commit.sha' "$RUNNER_TEMP/bb-main-ref.json")"
          [[ "$MAIN_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Invalid upstream main SHA' >&2; exit 1; }
          curl --fail --silent --show-error --retry 2 --max-time 30 \
            "https://raw.githubusercontent.com/get-bb/bb/$MAIN_SHA/packages/plugin-sdk/package.json" > "$RUNNER_TEMP/bb-main-sdk.json"
          curl --fail --silent --show-error --retry 2 --max-time 30 \
            https://raw.githubusercontent.com/get-bb/bb/7b26cae79ec978fafd0a5db0e8517e94f12eb8f4/packages/plugin-sdk/package.json > "$RUNNER_TEMP/bb-pin-sdk.json"
          MAIN_SDK="$(node -p 'JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).version' "$RUNNER_TEMP/bb-main-sdk.json")"
          PIN_SDK="$(node -p 'JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).version' "$RUNNER_TEMP/bb-pin-sdk.json")"
          test "$PIN_SDK" = '0.6.132'
          [[ "$MAIN_SDK" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Unreviewed upstream SDK version syntax' >&2; exit 1; }
          if [ "$SDK_CONTEXT" = 'pinned' ]; then SDK_VERSION="$PIN_SDK"; else SDK_VERSION="$MAIN_SDK"; fi
          echo "SDK_VERSION=$SDK_VERSION" >> "$GITHUB_ENV"
          echo "UPSTREAM_MAIN_SHA=$MAIN_SHA" >> "$GITHUB_ENV"
          echo "D064 context=$SDK_CONTEXT upstream_sha=$MAIN_SHA source_sdk=$MAIN_SDK tested_sdk=$SDK_VERSION"
          printf '### D064 actual published SDK test (NOT runtime compatibility)\n\n- Upstream main SHA: %s\n- SDK version declared there: %s\n- Tested published SDK version: %s (%s)\n- Pinned desktop-v0.49.0 SDK: %s\n- All edits occur ONLY in disposable runner copies. No BB source is edited.\n- A published SDK can differ from the exact Git source; full upstream-main build remains a separate gate.\n' "$MAIN_SHA" "$MAIN_SDK" "$SDK_VERSION" "$SDK_CONTEXT" "$PIN_SDK" >> "$GITHUB_STEP_SUMMARY"
      - name: Typecheck, test and bundle Hello against selected published SDK
        shell: bash
        run: |
          set -euo pipefail
          test "$SDK_CONTEXT" = 'pinned' || test "$SDK_CONTEXT" = 'upstream-main'
          mkdir -p "$RUNNER_TEMP/d064"
          cp -a plugins/suliko-hello "$RUNNER_TEMP/d064/hello"
          cd "$RUNNER_TEMP/d064/hello"
          node - <<'NODE'
          const fs=require('fs'),p=JSON.parse(fs.readFileSync('package.json','utf8'));
          if(p.devDependencies['@get-bb/plugin-sdk']!=='0.6.132'||p.engines.bbPluginSdk!=='>=0.6.132 <0.6.133')throw Error('Unexpected source manifest; do not widen support automatically');
          NODE
          pnpm install --no-frozen-lockfile
          if [ "$SDK_CONTEXT" = 'upstream-main' ]; then
            pnpm add -D -E "@get-bb/plugin-sdk@$SDK_VERSION"
          fi
          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('node_modules/@get-bb/plugin-sdk/package.json','utf8'));
          if(p.version!==process.env.SDK_VERSION)throw Error('Installed SDK version does not match upstream manifest');
          NODE
          pnpm run typecheck
          pnpm test
          pnpm run build
          for file in dist/server.js dist/app.js dist/app.css dist/app.meta.json; do test -s "$file"; done
      - name: Typecheck, test and bundle Remote MOCK panel against selected published SDK
        shell: bash
        run: |
          set -euo pipefail
          cp -a plugins/suliko-remote-panel "$RUNNER_TEMP/d064/remote"
          cd "$RUNNER_TEMP/d064/remote"
          node - <<'NODE'
          const fs=require('fs'),p=JSON.parse(fs.readFileSync('package.json','utf8'));
          if(p.devDependencies['@get-bb/plugin-sdk']!=='0.6.132'||p.engines.bbPluginSdk!=='>=0.6.132 <0.6.133')throw Error('Unexpected mock source manifest');
          NODE
          pnpm install --no-frozen-lockfile --ignore-scripts
          if [ "$SDK_CONTEXT" = 'upstream-main' ]; then
            pnpm add -D -E --ignore-scripts "@get-bb/plugin-sdk@$SDK_VERSION"
          fi
          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('node_modules/@get-bb/plugin-sdk/package.json','utf8'));
          if(p.version!==process.env.SDK_VERSION)throw Error('Installed SDK version does not match upstream manifest');
          NODE
          pnpm run typecheck
          pnpm test
          pnpm exec esbuild app.tsx --bundle --platform=browser --format=esm --jsx=automatic --packages=external --outfile=dist/mock-panel.js
          test -s dist/mock-panel.js
      - name: Record precise scope
        if: always()
        shell: bash
        run: |
          printf '\nD064 compiles and tests plugin sources against npm published SDK %s. This does NOT override engine ranges, prove compatibility with upstream Git main at runtime, or authorize a version bump.\n' "${SDK_VERSION:-unresolved}" >> "$GITHUB_STEP_SUMMARY"
