name: D-066 BB+Hello loopback 30-minute RSS soak
on:
  push:
    branches: [feat/d066-soak-30min, main]
    paths: ['scripts/d066-soak*', '.github/workflows/d066-soak.yml']
  schedule:
    - cron: '37 5 * * 0'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bound-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.19.0'
      - run: node --test scripts/d066-soak.test.mjs
  live-soak:
    # Real 1800-second verification must run at exact feature SHA BEFORE main merge.
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/d066-soak-30min'
    needs: bound-test
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      BB_SERVER_PORT: '38891'
      BB_HOST_DAEMON_PORT: '38892'
      BB_SERVER_BIND_HOST: '127.0.0.1'
      BB_TELEMETRY: 'false'
      CI: 'true'
      D066_SOAK_SECONDS: '1800'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout and verify frozen stock BB source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: get-bb/bb
          ref: desktop-v0.49.0
          path: stock-bb
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.19.0'
      - name: Build immutable upstream for disposable test only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C stock-bb rev-parse HEAD)" = 7b26cae79ec978fafd0a5db0e8517e94f12eb8f4
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
          (cd stock-bb && pnpm install --frozen-lockfile && pnpm run build)
      - name: Start only disposable localhost BB and reviewed Hello plugin
        shell: bash
        run: |
          set -euo pipefail
          export BB_DATA_DIR="$RUNNER_TEMP/d066-soak-data"
          mkdir -p "$BB_DATA_DIR"
          node stock-bb/packages/bb-app/dist/bb-app.js start --data-dir "$BB_DATA_DIR" --server-bind-host 127.0.0.1 --server-port 38891 --host-daemon-port 38892 --no-in-app-updates >"$RUNNER_TEMP/d066-soak-startup.log" 2>&1 &
          ready=0
          for i in $(seq 1 45); do
            if curl --silent --fail --max-time 2 --output /dev/null http://127.0.0.1:38891/health 2>/dev/null; then ready=1; break; fi
            sleep 2
          done
          test "$ready" = 1 || { echo "D066 startup failed"; exit 1; }
          node stock-bb/packages/bb-app/dist/bb.js plugin install ./plugins/suliko-hello --yes >/dev/null
          node stock-bb/packages/bb-app/dist/bb.js plugin list --json >/dev/null
          echo "$BB_DATA_DIR" >"$RUNNER_TEMP/d066-soak-data-path"
      - name: Continuously sample the same loopback listener's RSS and health for full 1800s
        run: node scripts/d066-soak.mjs
      - name: Stop temporary BB even after failed gate
        if: always()
        shell: bash
        run: |
          if [ -s "$RUNNER_TEMP/d066-soak-data-path" ]; then
            node stock-bb/packages/bb-app/dist/bb-app.js stop --data-dir "$(cat "$RUNNER_TEMP/d066-soak-data-path")" >/dev/null 2>&1 || true
          fi
