name: D-059 synthetic doctor redaction (NO live credentials)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [feat/d059-synthetic-doctor, fix/d059-stock-bb-plugin-ids, main]
    paths:
      - 'scripts/suliko-doctor.mjs'
      - 'tests/doctor/**'
      - '.github/workflows/d059-doctor.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.19.0'
          package-manager-cache: false
      - name: Zero leak synthetic bundle + strict fail-closed checks
        run: node --test tests/doctor/doctor.test.mjs
