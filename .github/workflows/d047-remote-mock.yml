# [ChatGPT] D-047: client-only SDK harness for the Remote MOCK panel.
# No Remote API traffic, token, agent, or Human Gate action.
name: REM-04 offline Remote mock panel SDK tests
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [feat/d047-remote-mock-sdk, feat/d060-remote-mock-state, feat/d061-remote-i18n]
    paths: ['.github/workflows/d047-remote-mock.yml', 'plugins/suliko-remote-panel/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mock-sdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: 'true'
      BB_TELEMETRY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.19.0'
          package-manager-cache: false
      - name: Pin public SDK, test mock panel and compile client-only bundle
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
          node - <<'NODE'
          const p=require('./plugins/suliko-remote-panel/package.json');
          if(p.devDependencies['@get-bb/plugin-sdk']!=='0.6.132') throw Error('Unreviewed SDK');
          if(p.engines.bb!=='>=0.49.0 <0.49.1') throw Error('Unreviewed stock BB');
          if(p.bb?.server) throw Error('Mock panel must not register server backend');
          if(p.devDependencies.esbuild!=='0.28.2') throw Error('Unpinned client bundle tool');
          NODE
          cd plugins/suliko-remote-panel
          pnpm install --no-frozen-lockfile --ignore-scripts
          pnpm run typecheck
          pnpm run test
          pnpm exec esbuild app.tsx --bundle --platform=browser --format=esm --jsx=automatic --packages=external --outfile=dist/mock-panel.js
          test -s dist/mock-panel.js
      - name: Document narrow mock-only result
        if: success()
        run: |
          echo 'REM-04 SDK-level offline fixture/typecheck, UI tests and client-only JS bundle passed; no BB plugin package installation claimed. No token, Remote call, live approval, Desktop/Web mount or Tailscale was exercised.' >> "$GITHUB_STEP_SUMMARY"
