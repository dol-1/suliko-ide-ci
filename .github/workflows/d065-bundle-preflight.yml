name: D-065 nonpublishing plugin build and checksum preflight
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [feat/d065-bundle-preflight, main]
    paths: ['.github/workflows/d065-bundle-preflight.yml', 'plugins/suliko-hello/**', 'plugins/suliko-remote-panel/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  built-bundle-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.19.0'
      - name: Pin BB SDK and build only our Hello plugin bundle
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
          node - <<'NODE'
          const fs=require('node:fs');
          for(const name of ['suliko-hello','suliko-remote-panel']) {
            const p=JSON.parse(fs.readFileSync('plugins/'+name+'/package.json','utf8'));
            if(p.devDependencies['@get-bb/plugin-sdk']!=='0.6.132'||p.engines.bb!=='>=0.49.0 <0.49.1')throw Error('Unreviewed SDK/BB pin');
          }
          NODE
          cd plugins/suliko-hello
          pnpm install --no-frozen-lockfile
          pnpm run typecheck
          pnpm test
          pnpm run build
          for item in dist/server.js dist/app.js dist/app.css dist/app.meta.json; do test -s "$item"; done
      - name: Build mock Remote UI bundle without live Remote data or credentials
        shell: bash
        run: |
          set -euo pipefail
          cd plugins/suliko-remote-panel
          pnpm install --no-frozen-lockfile --ignore-scripts
          pnpm run typecheck
          pnpm run test
          pnpm exec esbuild app.tsx --bundle --platform=browser --format=esm --jsx=automatic --packages=external --outfile=dist/mock-panel.js
          test -s dist/mock-panel.js
      - name: Record SHA-256 of actual built files; never upload or publish
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto');
          const paths=['plugins/suliko-hello/dist/server.js',
            'plugins/suliko-hello/dist/app.js','plugins/suliko-hello/dist/app.css',
            'plugins/suliko-remote-panel/dist/mock-panel.js'];
          const entries=paths.map(path=>{
            const b=fs.readFileSync(path);
            if(!b.length)throw Error('Unexpected empty built file');
            return{path,bytes:b.length,sha256:crypto.createHash('sha256').update(b).digest('hex')};
          });
          const runSha=process.env.GITHUB_SHA;
          if(!/^[0-9a-f]{40}$/.test(runSha??''))throw Error('Missing exact GitHub run head SHA');
          const note='E8 D065 NONPUBLISHING BUILD PREVIEW only (no SBOM/attestation/release):\n'+
            'GitHub head: '+runSha+'\n'+entries.map(e=>e.path+' '+e.sha256+' bytes='+e.bytes).join('\n')+'\n';
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,note);
          console.log('D065 actual own-plugin Hello bundle + Remote mock UI output checksummed; 4 files; no publication, full SBOM or attestation');
          NODE
