name: D-181 owner phase 3-action reference lint (NO launch)
# D244 new D242-main exact-source 32 synthetic doctor secret redaction and all 3OS/QA/security gates.
# D247 exact D252 source premerge note: every required real hosted CI path, no auto-merge.
# D242 new-source SHA complete proof: 14 genuine impacted workflows, including D252 glossary.
# D242 exact D252-main 13-source-gate proof; source-only preview no publication.
# D252 exact-head: full 14-way own bilingual docs/SDK/QA/security/native evidence, no release.
on:
  push:
    branches: [test/d244-doctor-after-d242, feat/d247-premerge-post-d252, feat/d242-trust-after-d247, feat/d252-ka-en-glossary-lint, feat/d230-first15-after-d226, '**', fix/d225-owner-one-canonical-link-after-d219, fix/d203-pages-api-response-ownerlint, fix/d184-owner-lint-nofollow, feat/d181-owner-phase-preflight, main]
    paths:
      - 'scripts/d202-exact-head-gate.mjs'
      - 'scripts/d230-first15-metrics.mjs'
      - 'docs/owner-pack/**'
      - 'scripts/d181-owner-pack-lint.mjs'
      - 'scripts/d226-d083-policy.mjs'
      - '.github/workflows/d181-owner-pack-lint.yml'
      - '.github/workflows/d062-docs.yml'
      - '.github/workflows/spike04-marketplace-rc.yml'
      - 'marketplace/rc/**'
      - '.github/ISSUE_TEMPLATE/pilot-signup.yml'
  workflow_dispatch:
concurrency:
  group: d181-owner-pack-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  owner-reference-lint:
    if: github.repository == 'dol-1/suliko-ide-ci'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.19.0'
          package-manager-cache: false
      - name: All three owner references are real existing files and gated
        run: |
          node --check scripts/d181-owner-pack-lint.mjs
          node scripts/d181-owner-pack-lint.mjs
