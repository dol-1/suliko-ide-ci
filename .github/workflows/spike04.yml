name: SPIKE-04 public SDK plugin
on:
  workflow_dispatch:
  push:
    paths: ['plugins/suliko-hello/**', '.github/workflows/spike04.yml']
permissions:
  contents: read
jobs:
  sdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.19.0'
      - working-directory: plugins/suliko-hello
        run: |
          npm install --include=dev --no-audit --no-fund
          npm run typecheck
          npm test
          npm run build
