name: SPIKE-04 public SDK plugin
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  workflow_dispatch:
  push:
    paths: ['plugins/suliko-hello/**', '.github/workflows/spike04.yml']
permissions:
  contents: read
jobs:
  sdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.19.0'
      # npm 10.9.3 Arborist crashed on this package's dependency graph (edgesOut);
      # use BB's own pinned pnpm 9.15.0, without skipping any checks.
      - name: Install pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
          pnpm --version
      - name: Full plugin SDK checks
        working-directory: plugins/suliko-hello
        run: |
          pnpm install --no-frozen-lockfile
          pnpm run typecheck
          pnpm test
          pnpm run build
