name: D-063 Semgrep pinned plugin and CLI security scan
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [feat/d206-rc-notes-after-d220, feat/d220-pages-v501-after-d225, fix/d225-owner-one-canonical-link-after-d219, feat/d219-share-readiness-after-d218, feat/d218-tag-install-docs-after-d217, feat/d217-affected-ci-after-main-f98, fix/d215-rc-pin-d117-icon-main-green, feat/d204-live-pages-check, feat/d205-tag-proof-after-pages-fix, draft/d199-owner-rc-sha-main-1c747093, fix/d203-pages-api-response-ownerlint, feat/d203-pages-api-only-gate, feat/d198-doctor-after-d197, feat/d197-locked-cli-after-d199, feat/d199-candidate-main-proof, feat/d189-e3-mock-after-d196, feat/d196-pilot-support-main-replay, feat/d190-docs-as-test-3os, feat/d188-qa-concurrency-isolation, feat/d187-e3-main-push-gate, feat/d186-e3-approval-status-integrity, feat/d169-fastcheck-native-parsers, feat/d165-end-user-one-command, fix/d184-owner-lint-nofollow, feat/d176-repro-builder-env-hardening, feat/d166-repro-rc-candidate, feat/d063-semgrep-own-code, feat/d155-published-native-3os-sec02-hello, feat/d159-native-gui-published-same-runtime, fix/d160-native-mac-strict-state, feat/d161-native-linux-same-runtime, feat/d162-native-3os-same-run, feat/d163-strict-live-plugin-state-contract, feat/d164-native-loopback-real-listeners, feat/d173-source-sdk-0144, feat/d171-daily-qa01-main-v2, feat/d168-pages-preflight-main, main]
    paths:
      - '.github/workflows/d219-share-link-readiness.yml'
      - '.github/workflows/d218-tag-install-3os.yml'
      - '.github/workflows/d128-e3-same-run-mock.yml'
      - '.github/workflows/d196-pilot-replies.yml'
      - '.github/workflows/d190-docs-as-test-3os.yml'
      - '.github/workflows/d217-affected-workflows.yml'
      - '.github/workflows/d165-e1-one-command-3os.yml'
      - 'marketplace/rc/**'
      - 'scripts/d198-doctor-live.mjs'
      - 'scripts/d197-bb-cli-lock/**'
      - '.github/workflows/d166-rc-candidate.yml'
      - 'marketplace/rc/EXPECTED_SHA.candidate'
      - '.github/workflows/qa01-parity-run.yml'
      - '.github/workflows/d173-sdk-0144.yml'
      - '.github/workflows/d063-semgrep.yml'
      - '.github/workflows/d062-docs.yml'
      - 'scripts/d204-live-pages-links.mjs'
      - '.github/workflows/d205-tag-d166-dispatch.yml'
      - 'marketplace/rc/EXPECTED_SHA'
      - 'plugins/**'
      - 'scripts/**'
  schedule:
    - cron: '47 4 * * 2'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan-own-code:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Pinned open Semgrep CLI, privacy-minimal security rules
        shell: bash
        env:
          SEMGREP_SEND_METRICS: 'off'
        run: |
          set -euo pipefail
          folder="$RUNNER_TEMP/d063-semgrep"
          mkdir -m 700 -p "$folder"
          trap 'rm -rf -- "$folder"' EXIT
          python3 -m venv "$folder/venv"
          "$folder/venv/bin/pip" install --disable-pip-version-check --no-input 'semgrep==1.185.0' >"$folder/install.log" 2>&1 || { echo 'Pinned Semgrep installation failed' >&2; exit 1; }
          "$folder/venv/bin/semgrep" --version
          set +e
          "$folder/venv/bin/semgrep" scan --config p/security-audit --config p/javascript --metrics off --error --json --output "$folder/findings.json" --exclude '**/node_modules/**' --exclude '**/dist/**' plugins/suliko-hello plugins/suliko-remote-panel scripts >"$folder/scan.stdout" 2>"$folder/scan.stderr"
          code=$?
          set -e
          node - "$folder/findings.json" <<'NODE'
          const fs = require('node:fs'), file=process.argv[2];
          if(!fs.existsSync(file)) { console.log('D063 Semgrep report absent; scanner exit code governs'); process.exit(0); }
          const v=JSON.parse(fs.readFileSync(file,'utf8'));
          if(!Array.isArray(v.results)||!Array.isArray(v.errors)) throw Error('Malformed scanner report');
          console.log('D063 plugin/CLI Semgrep findings:',v.results.length,'scanner errors:',v.errors.length);
          // Only fixed public Semgrep rule IDs, not paths, source lines, snippets,
          // messages or trace contents. This lets us correct code without muting CI.
          const ids=[...new Set(v.results.map(r => r?.check_id))].sort();
          for(const id of ids) {
            if(typeof id==='string' && /^[a-zA-Z0-9_.:-]{1,160}$/.test(id))
              console.log('D063 safe public rule identifier:', id);
            else console.log('D063 safe public rule identifier: unclassified');
          }
          NODE
          if [ "$code" -ne 0 ]; then
            echo 'D063 Semgrep scan did not pass; raw findings stay private to ephemeral runner, not uploaded.' >&2
            exit "$code"
          fi
          echo 'D063 Semgrep own-plugin and CLI security rules passed; BB core and private IDE repo not scanned.'
