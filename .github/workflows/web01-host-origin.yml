# [ChatGPT] D-045 isolated WEB-01 Host/Origin smoke, no Tailscale or public bind.
name: WEB-01 stock BB loopback Host-Origin matrix
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [feat/d045-web01-origin-matrix]
    paths: ['.github/workflows/web01-host-origin.yml', 'scripts/web01-host-origin.mjs']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host-origin:
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    env:
      CI: 'true'
      BB_TELEMETRY: 'false'
      BB_SERVER_BIND_HOST: '127.0.0.1'
      BB_SERVER_PORT: '38885'
      BB_WEB01_PORT: '38885'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: get-bb/bb
          ref: desktop-v0.49.0
          path: stock-bb
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.19.0'
          package-manager-cache: false
      - name: Build immutable BB 0.49.0
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C stock-bb rev-parse HEAD)" = '7b26cae79ec978fafd0a5db0e8517e94f12eb8f4'
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
          (cd stock-bb && pnpm install --frozen-lockfile && pnpm run build)
      - name: Start disposable loopback BB and run all Host/Origin cases
        shell: bash
        timeout-minutes: 20
        run: |
          set -euo pipefail
          export BB_DATA_DIR="$RUNNER_TEMP/web01-data"
          cleanup(){ node stock-bb/packages/bb-app/dist/bb-app.js stop --data-dir "$BB_DATA_DIR" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          node stock-bb/packages/bb-app/dist/bb-app.js start --data-dir "$BB_DATA_DIR" --server-bind-host 127.0.0.1 --server-port 38885 --no-in-app-updates >"$RUNNER_TEMP/web01-server.log" 2>&1 &
          ready=0
          for i in $(seq 1 45); do
            if node stock-bb/packages/bb-app/dist/bb.js settings show --json >/dev/null 2>&1; then ready=1; break; fi
            sleep 2
          done
          test "$ready" = 1 || { echo "loopback server not ready"; exit 1; }
          node scripts/web01-host-origin.mjs
          cat web01-results.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload actual Host-Origin matrix (including failures)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: d045-web01-host-origin-matrix
          path: web01-results.md
          if-no-files-found: warn
          retention-days: 30
