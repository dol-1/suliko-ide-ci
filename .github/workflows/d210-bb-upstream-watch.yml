name: D-210 BB upstream stable release and license watcher (artifact only NO issue)
on:
  push:
    branches: [feat/d210-bb-upstream-watch]
    paths:
      - '.github/workflows/d210-bb-upstream-watch.yml'
      - 'scripts/d210-bb-upstream-watch.mjs'
      - 'docs/ops/BB-UPGRADE-RUNBOOK.md'
  schedule:
    - cron: '19 11 * * *'
concurrency:
  group: d210-upstream-${{ github.ref }}
  cancel-in-progress: true
permissions: read-all
jobs:
  release-watch:
    if: github.repository == 'dol-1/suliko-ide-ci'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22.19.0'
          package-manager-cache: false
      - name: Read-only public upstream stable release and repo license, no POST
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/d210-bb-upstream-watch.mjs --self-test
          {
            printf '{"latest":'
            gh api /repos/get-bb/bb/releases/latest
            printf ',"repo":'
            gh api /repos/get-bb/bb
            printf '}'
          } | node scripts/d210-bb-upstream-watch.mjs
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: d210-bb-upstream-readonly-review
          path: out/d210/
          retention-days: 7
          if-no-files-found: error
