name: D-152 refuse escaped GitHub runner and concurrency expressions before mirror
on:
  push:
    branches: [feat/d254-7d-ci-usage-audit, feat/d202-uninstall-after-d230, feat/d230-first15-after-d226, fix/d226-premerge-after-d227, feat/d227-two-viewport-after-d234, feat/d234-mock-schema-after-d228, feat/d228-pinned-upstream-matrix-categories, feat/d233-windows-trust-after-d211, feat/d211-28routes-after-d229, feat/d229-main-completeness-after-d210, feat/d210-bb-watch-after-d214, feat/d214-support-runbook-after-d224, fix/d224-exact-main-artifact-after-merge, feat/d221-node24-after-d223, feat/d223-changelog-after-d206-main, feat/d206-rc1-notes-after-d208, feat/d208-pilot-kit-after-d220, feat/d220-pages-v501-after-d225, fix/d225-owner-one-canonical-link-after-d219, feat/d219-share-readiness-after-d218, feat/d218-tag-install-docs-after-d217, feat/d217-affected-ci-after-main-f98, fix/d215-rc-pin-d117-icon-main-green, feat/d204-live-pages-check, feat/d205-tag-proof-after-pages-fix, draft/d199-owner-rc-sha-main-1c747093, fix/d203-pages-api-response-ownerlint, feat/d203-pages-api-only-gate, feat/d198-doctor-after-d197, feat/d197-locked-cli-after-d199, feat/d199-candidate-main-proof, feat/d189-e3-mock-after-d196, feat/d196-pilot-support-main-replay, feat/d190-docs-as-test-3os, feat/d188-qa-concurrency-isolation, feat/d187-e3-main-push-gate, feat/d186-e3-approval-status-integrity, feat/d169-fastcheck-native-parsers, feat/d165-end-user-one-command, fix/d184-owner-lint-nofollow, feat/d176-repro-builder-env-hardening, feat/d166-repro-rc-candidate, feat/d168-pages-preflight-main, main, feat/d171-daily-qa01-main-v2, feat/d173-source-sdk-0144, fix/d152-workflow-expression-guard, feat/d159-native-gui-published-same-runtime, fix/d160-native-mac-strict-state, feat/d161-native-linux-same-runtime, feat/d162-native-3os-same-run, feat/d163-strict-live-plugin-state-contract, feat/d164-native-loopback-real-listeners]
    paths: ['scripts/d165-native-one-command.mjs', 'marketplace/rc/EXPECTED_SHA.candidate', 'marketplace/rc/EXPECTED_SHA', 'scripts/d215-rc-pin.mjs', 'scripts/d215-rc-pin.test.mjs', '.github/workflows/**', 'scripts/d152-workflow-expression-check.mjs', 'scripts/d152-workflow-expression-check.test.mjs', 'scripts/d159-installed-gui-published-native.mjs', 'scripts/d217-affected-workflows.mjs', 'scripts/d217-affected-workflows.test.mjs', 'scripts/d230-first15-metrics.mjs', 'scripts/d202-exact-head-gate.mjs']
  workflow_dispatch:
concurrency:
  group: d152-workflow-expr-${{ github.ref }}
  cancel-in-progress: true
permissions: read-all
jobs:
  workflow-expression-integrity:
    if: github.repository == 'dol-1/suliko-ide-ci'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.19.0'
          package-manager-cache: false
      - name: Pure source-owned expression negative tests
        run: node --test scripts/d152-workflow-expression-check.test.mjs
      - name: Lint all public CI workflow group and runs-on expressions
        run: node scripts/d152-workflow-expression-check.mjs .github/workflows
      - name: Verify callable QA cannot cancel standalone QA via shared group
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const qa = fs.readFileSync('.github/workflows/qa01-parity-run.yml', 'utf8');
          const release = fs.readFileSync('.github/workflows/d085-release-dry-run.yml', 'utf8');
          const group = qa.match(/^concurrency:\r?\n  group: ([^\r\n]+)/m)?.[1];
          const caller = String.fromCharCode(36) + '{{ github.workflow }}';
          const ref = String.fromCharCode(36) + '{{ github.ref }}';
          if (!group || !group.includes(caller) || !group.includes(ref)) {
            throw Error('QA concurrency must differentiate called vs standalone workflow');
          }
          if (!/\n  cancel-in-progress: true\r?\n/.test(qa)) {
            throw Error('QA stale-workflow cancellation disabled');
          }
          const releaseGroup = release.match(/^concurrency:\r?\n  group: ([^\r\n]+)/m)?.[1];
          if (!releaseGroup || releaseGroup === group) {
            throw Error('Reusable QA and release parent share cancellation group');
          }
          if (!release.includes('uses: ./.github/workflows/qa01-parity-run.yml')) {
            throw Error('D144 no longer gates dry-run on strict 7x2 callable QA');
          }
          if (!qa.includes("schedule:\n    - cron: '13 7 * * *'")) {
            throw Error('Daily strict QA schedule unexpectedly modified');
          }
          console.log('D188 caller-identity QA isolation: source contract PASS');
          NODE

