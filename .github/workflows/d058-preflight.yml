name: D-058 safe setup preflight (no installer executed)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [feat/d058-safe-bootstrap, feat/d058-verified-download-ci, feat/d058-cache-isolation-tests, feat/d058-symlink-cache-guard, main]
    paths:
      - scripts/suliko-setup.sh
      - scripts/suliko-setup.ps1
      - .github/workflows/d058-preflight.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dry-run:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout public scripts, without persisting credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Bash dry-run, negative checksum, uninstall
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          test_home="$RUNNER_TEMP/d058-home"
          mkdir -p "$test_home"
          HOME="$test_home" bash scripts/suliko-setup.sh --dry-run
          printf 'non-official-fixture' > "$RUNNER_TEMP/d058-bad.bin"
          if HOME="$test_home" bash scripts/suliko-setup.sh --verify-file "$RUNNER_TEMP/d058-bad.bin"; then
            echo 'FAIL: bad checksum accepted'; exit 1
          fi
          # Exercise the REAL pinned official asset digest; never execute the downloaded file.
          HOME="$test_home" bash scripts/suliko-setup.sh --download-verified
          if [[ "$(uname -s)" == Darwin ]]; then expected_asset=bb-0.49.0-arm64.dmg; else expected_asset=bb-0.49.0-x86_64.AppImage; fi
          test -s "$test_home/.cache/suliko-ide/$expected_asset"
          HOME="$test_home" bash scripts/suliko-setup.sh --uninstall
          test ! -e "$test_home/.cache/suliko-ide"
          # Uninstall may delete ONLY its own downloaded cache asset.
          # Never remove an unrelated cache entry or the user's BB data.
          mkdir -p "$test_home/.cache/suliko-ide" "$test_home/.config/bb"
          printf 'unrelated-synthetic-cache' > "$test_home/.cache/suliko-ide/unrelated.txt"
          printf 'synthetic-user-data' > "$test_home/.config/bb/user-data.txt"
          HOME="$test_home" bash scripts/suliko-setup.sh --uninstall
          test "$(cat "$test_home/.cache/suliko-ide/unrelated.txt")" = unrelated-synthetic-cache
          test "$(cat "$test_home/.config/bb/user-data.txt")" = synthetic-user-data
          # A redirected parent/cache must never make uninstall delete foreign files.
          diverted="$RUNNER_TEMP/d058-foreign-cache"
          symlink_home="$RUNNER_TEMP/d058-symlink-home"
          mkdir -p "$diverted/suliko-ide" "$symlink_home"
          printf 'preserve-foreign-asset' > "$diverted/suliko-ide/$expected_asset"
          ln -s "$diverted" "$symlink_home/.cache"
          if HOME="$symlink_home" bash scripts/suliko-setup.sh --uninstall >/dev/null 2>&1; then
            echo 'FAIL: uninstall followed a foreign cache symlink'; exit 1
          fi
          test "$(cat "$diverted/suliko-ide/$expected_asset")" = preserve-foreign-asset
          if HOME="$symlink_home" bash scripts/suliko-setup.sh --download-verified >/dev/null 2>&1; then
            echo 'FAIL: download followed a foreign cache symlink'; exit 1
          fi
          test "$(cat "$diverted/suliko-ide/$expected_asset")" = preserve-foreign-asset
          # Direct Suliko cache symlink (rather than parent) must also be refused.
          direct_home="$RUNNER_TEMP/d058-direct-home"
          mkdir -p "$direct_home/.cache"
          ln -s "$diverted/suliko-ide" "$direct_home/.cache/suliko-ide"
          if HOME="$direct_home" bash scripts/suliko-setup.sh --uninstall >/dev/null 2>&1; then
            echo 'FAIL: uninstall followed a linked managed cache'; exit 1
          fi
          test "$(cat "$diverted/suliko-ide/$expected_asset")" = preserve-foreign-asset
          # No cached item may be verified through a symlink, even if its
          # target happens to be a regular file.
          ln -s "$RUNNER_TEMP/d058-bad.bin" "$RUNNER_TEMP/d058-link.bin"
          if HOME="$test_home" bash scripts/suliko-setup.sh --verify-file "$RUNNER_TEMP/d058-link.bin"; then
            echo 'FAIL: symlink verification was allowed'; exit 1
          fi
      - name: PowerShell dry-run, negative checksum, uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'd058-test-local'
          New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA | Out-Null
          ./scripts/suliko-setup.ps1 -DryRun
          $bad = Join-Path $env:RUNNER_TEMP 'd058-bad.bin'
          Set-Content -LiteralPath $bad -Value 'non-official-fixture' -NoNewline
          $failed = $false
          try { ./scripts/suliko-setup.ps1 -VerifyFile $bad } catch { $failed = $true }
          if (-not $failed) { throw 'FAIL: bad checksum accepted' }
          # Download official Windows x64 asset and verify pinned digest before cache cleanup.
          ./scripts/suliko-setup.ps1 -DownloadVerified
          if (-not (Test-Path -LiteralPath (Join-Path $env:LOCALAPPDATA 'SulikoIDE\\Cache\\bb-0.49.0-x64.exe') -PathType Leaf)) { throw 'Verified asset not cached' }
          ./scripts/suliko-setup.ps1 -Uninstall
          if (Test-Path -LiteralPath (Join-Path $env:LOCALAPPDATA 'SulikoIDE\Cache')) { throw 'Cache survived cleanup' }
          # Another cache entry and BB user data must survive --Uninstall.
          $cacheDir = Join-Path $env:LOCALAPPDATA 'SulikoIDE\Cache'
          $bbDir = Join-Path $env:LOCALAPPDATA 'bb-user-data'
          New-Item -ItemType Directory -Force -Path $cacheDir, $bbDir | Out-Null
          Set-Content -LiteralPath (Join-Path $cacheDir 'unrelated.txt') -Value 'synthetic-third-party' -NoNewline
          Set-Content -LiteralPath (Join-Path $bbDir 'user-data.txt') -Value 'synthetic-user-data' -NoNewline
          ./scripts/suliko-setup.ps1 -Uninstall
          if ((Get-Content -LiteralPath (Join-Path $cacheDir 'unrelated.txt') -Raw) -cne 'synthetic-third-party') { throw 'Unrelated cache changed' }
          if ((Get-Content -LiteralPath (Join-Path $bbDir 'user-data.txt') -Raw) -cne 'synthetic-user-data') { throw 'BB user data changed' }
          # Windows junctions can redirect a managed parent into unrelated data.
          $foreignRoot = Join-Path $env:RUNNER_TEMP 'd058-foreign-junction'
          $foreignCache = Join-Path $foreignRoot 'Cache'
          $junctionLocal = Join-Path $env:RUNNER_TEMP 'd058-junction-local'
          New-Item -ItemType Directory -Force -Path $foreignCache, $junctionLocal | Out-Null
          $foreignAsset = Join-Path $foreignCache 'bb-0.49.0-x64.exe'
          Set-Content -LiteralPath $foreignAsset -Value 'foreign-cache-must-survive' -NoNewline
          New-Item -ItemType Junction -Path (Join-Path $junctionLocal 'SulikoIDE') -Target $foreignRoot | Out-Null
          $env:LOCALAPPDATA = $junctionLocal
          $blocked = $false
          try { ./scripts/suliko-setup.ps1 -Uninstall } catch { $blocked = $true }
          if (-not $blocked) { throw 'FAIL: uninstall followed foreign junction parent' }
          if ((Get-Content -LiteralPath $foreignAsset -Raw) -cne 'foreign-cache-must-survive') { throw 'Foreign junction cache changed' }
          $blocked = $false
          try { ./scripts/suliko-setup.ps1 -DownloadVerified } catch { $blocked = $true }
          if (-not $blocked) { throw 'FAIL: download followed foreign junction parent' }
          if ((Get-Content -LiteralPath $foreignAsset -Raw) -cne 'foreign-cache-must-survive') { throw 'Foreign junction cache changed on download' }
