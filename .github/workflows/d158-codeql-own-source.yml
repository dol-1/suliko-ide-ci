name: D-158 pinned CodeQL JS TS source security gate (SARIF not uploaded)
on:
  push:
    branches: [feat/d224-digest-after-d221, feat/d221-node24-after-d223, feat/d223-changelog-after-d206-main, feat/d206-rc1-notes-after-d208, feat/d208-pilot-kit-after-d220, feat/d220-pages-v501-after-d225, fix/d225-owner-one-canonical-link-after-d219, feat/d219-share-readiness-after-d218, feat/d218-tag-install-docs-after-d217, feat/d217-affected-ci-after-main-f98, fix/d215-rc-pin-d117-icon-main-green, feat/d204-live-pages-check, feat/d205-tag-proof-after-pages-fix, draft/d199-owner-rc-sha-main-1c747093, fix/d203-pages-api-response-ownerlint, feat/d203-pages-api-only-gate, feat/d198-doctor-after-d197, feat/d197-locked-cli-after-d199, feat/d199-candidate-main-proof, feat/d189-e3-mock-after-d196, feat/d196-pilot-support-main-replay, feat/d190-docs-as-test-3os, feat/d188-qa-concurrency-isolation, feat/d187-e3-main-push-gate, feat/d186-e3-approval-status-integrity, feat/d169-fastcheck-native-parsers, feat/d165-end-user-one-command, fix/d184-owner-lint-nofollow, feat/d176-repro-builder-env-hardening, feat/d166-repro-rc-candidate, feat/d158-private-sarif-codeql, feat/d159-native-gui-published-same-runtime, fix/d160-native-mac-strict-state, feat/d161-native-linux-same-runtime, feat/d162-native-3os-same-run, feat/d163-strict-live-plugin-state-contract, feat/d164-native-loopback-real-listeners, feat/d173-source-sdk-0144, feat/d171-daily-qa01-main-v2, feat/d168-pages-preflight-main, main]
    paths:
      - '.github/workflows/d224-evidence-digest.yml'
      - '.github/workflows/d221-node24-pin.yml'
      - '.github/workflows/d219-share-link-readiness.yml'
      - '.github/workflows/d218-tag-install-3os.yml'
      - '.github/workflows/d128-e3-same-run-mock.yml'
      - '.github/workflows/d196-pilot-replies.yml'
      - '.github/workflows/d190-docs-as-test-3os.yml'
      - '.github/workflows/d217-affected-workflows.yml'
      - '.github/workflows/d165-e1-one-command-3os.yml'
      - 'marketplace/rc/**'
      - 'scripts/d198-doctor-live.mjs'
      - 'scripts/d197-bb-cli-lock/**'
      - '.github/workflows/d166-rc-candidate.yml'
      - 'marketplace/rc/EXPECTED_SHA.candidate'
      - '.github/workflows/qa01-parity-run.yml'
      - '.github/workflows/d173-sdk-0144.yml'
      - '.github/workflows/d158-codeql-own-source.yml'
      - '.github/workflows/d062-docs.yml'
      - 'scripts/d204-live-pages-links.mjs'
      - '.github/workflows/d205-tag-d166-dispatch.yml'
      - 'marketplace/rc/EXPECTED_SHA'
      - 'plugins/**'
      - 'scripts/**'
  workflow_dispatch:
concurrency:
  group: d158-codeql-${{ github.ref }}
  cancel-in-progress: true
permissions: read-all
jobs:
  source-codeql:
    if: github.repository == 'dol-1/suliko-ide-ci'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Initialize pinned official CodeQL for own JS/TS sources only
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
          config: |
            name: suliko-ci-own-code-only
            paths:
              - plugins
              - scripts
      - name: Run official scanner without uploading SARIF
        id: scan
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066
        with:
          upload: never
          upload-database: false
          output: ${{ runner.temp }}/d158-codeql-results
      - name: Require actual scanner output and zero findings, never log source details
        shell: bash
        env:
          SARIF_DIR: ${{ steps.scan.outputs.sarif-output }}
        run: |
          set -euo pipefail
          case "$SARIF_DIR" in "$RUNNER_TEMP"/d158-codeql-results) ;; *) echo 'Unexpected SARIF output directory' >&2; exit 1 ;; esac
          test -d "$SARIF_DIR" && test ! -L "$SARIF_DIR"
          trap 'rm -rf -- "$SARIF_DIR"' EXIT
          node - "$SARIF_DIR" <<'NODE'
          const fs=require('node:fs');
          const path=require('node:path');
          const dir=process.argv[2];
          // Nothing about source paths, snippets, messages, traces or scanner stderr is emitted.
          const queue=[dir]; const sarif=[];
          while(queue.length){
            const current=queue.shift();
            for(const ent of fs.readdirSync(current,{withFileTypes:true})){
              const full=path.join(current,ent.name);
              if(ent.isDirectory()) queue.push(full);
              else if(ent.isFile() && ent.name.endsWith('.sarif')) sarif.push(full);
              else if(ent.isSymbolicLink()) throw Error('CodeQL output symlink refused');
            }
          }
          if(sarif.length===0) throw Error('CodeQL produced no SARIF results');
          // Number source locations by stable *public owned-file index* only:
          // no full paths, repo filenames, source text or runner user data in logs.
          const {execFileSync}=require('node:child_process');
          const repo=process.env.GITHUB_WORKSPACE;
          if(!repo||!path.isAbsolute(repo)) throw Error('Missing public checkout');
          const owned=execFileSync('git',['ls-files','--','plugins','scripts'],
            {cwd:repo,encoding:'utf8',timeout:10000,maxBuffer:1000000})
            .split('\n').filter(Boolean).sort();
          const slots=new Map(owned.map((filename,index)=>[filename,index+1]));
          function safeSourceSlot(location){
            const physical=location?.physicalLocation;
            let uri=physical?.artifactLocation?.uri;
            if(typeof uri!=='string')return ['unmapped',0];
            try{uri=decodeURIComponent(uri);}catch{return ['unmapped',0];}
            if(uri.startsWith('file://'))uri=uri.slice('file://'.length);
            const rel=path.isAbsolute(uri)?path.relative(repo,uri):uri.replace(/^\.\//,'');
            const slot=slots.get(rel);
            const line=physical?.region?.startLine;
            return [slot||'unmapped',Number.isSafeInteger(line)&&line>0?line:0];
          }
          let findings=0;const rules=new Set();const diagnostics=[];
          for(const file of sarif){
            const doc=JSON.parse(fs.readFileSync(file,'utf8'));
            if(doc.version!=='2.1.0'||!Array.isArray(doc.runs)||doc.runs.length===0)
              throw Error('CodeQL SARIF structure rejected');
            for(const run of doc.runs){
              if(!Array.isArray(run.results)) throw Error('CodeQL result list absent');
              if(run.invocations?.some(x=>x.executionSuccessful===false))
                throw Error('CodeQL scanner reported unsuccessful invocation');
              findings+=run.results.length;
              for(const v of run.results){
                const id=v.ruleId;
                if(typeof id==='string'&&/^[A-Za-z0-9_.:/-]{1,120}$/.test(id))rules.add(id);
                else rules.add('unclassified');
                const [slot,line]=safeSourceSlot(v.locations?.[0]);
                diagnostics.push({rule:typeof id==='string'&&/^[A-Za-z0-9_.:/-]{1,120}$/.test(id)?id:'unclassified',slot,line});
              }
            }
          }
          console.log('D158 CodeQL security-extended SARIF files:',sarif.length,'findings:',findings);
          if(findings){
            for(const item of diagnostics) console.log('D158 safe finding rule:',item.rule,'public-file-slot:',item.slot,'source-line:',item.line);
            process.exit(1);
          }
          NODE
          echo 'D158_CODEQL_OWN_CODE_FINDINGS=0; independent source-only scanner, not SEC04 or signed release.' >> "$GITHUB_STEP_SUMMARY"
