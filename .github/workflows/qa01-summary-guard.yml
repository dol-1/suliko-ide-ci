name: QA-01 fail-closed categorical report contract (synthetic only)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [fix/qa01-categorical-summary-guard, feat/qa01-45s-categorical-controls]
    paths: ['scripts/qa01-parity-summary.mjs', 'scripts/qa01-parity-summary.test.mjs', '.github/workflows/qa01-summary-guard.yml']
  workflow_dispatch:
permissions: read-all
jobs:
  synthetic-safety:
    if: github.repository == 'dol-1/suliko-ide-ci'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.19.0'
          package-manager-cache: false
      - name: Synthetic leak/contract-negative cases with fixed phase whitelist, no Playwright runtime
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/qa01-parity-summary.mjs
          node --test scripts/qa01-parity-summary.test.mjs
          echo 'QA01 summary only: categorical, no untrusted status/title/errors echoed, no 14/14 runtime or beta claim.' >> "$GITHUB_STEP_SUMMARY"
