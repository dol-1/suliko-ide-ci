# QA-01: no test skips/retries; full 7×2 matrix on disposable stock BB.
name: QA-01 seven-by-two parity run (Linux experimental)
on:
  push:
    branches: [feat/d040-experimental-runs, feat/d040-parity-daemon-port-fix]
    paths: ['.github/workflows/qa01-parity-run.yml', 'tests/parity/**', 'plugins/suliko-hello/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CI: 'true'
      BB_TELEMETRY: 'false'
      BB_SERVER_BIND_HOST: '127.0.0.1'
      BB_SERVER_PORT: '38888'
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - name: Checkout isolated parity fixture and reviewed plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout exact stock BB
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: get-bb/bb
          ref: desktop-v0.49.0
          path: stock-bb
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.19.0'
          package-manager-cache: false
      - name: Build pinned stock BB and Linux packaged Electron
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C stock-bb rev-parse HEAD)" = "7b26cae79ec978fafd0a5db0e8517e94f12eb8f4"
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
          cd stock-bb
          pnpm install --frozen-lockfile
          pnpm run build
          pnpm --dir apps/desktop run prepare-runtime
          pnpm --dir apps/desktop run desktop:build:linux
      - name: Install Playwright test runner/browser (non-privileged)
        shell: bash
        run: |
          set -euo pipefail
          cd tests/parity
          npm install --include=dev --no-audit --no-fund
          npx playwright install chromium
          command -v xvfb-run
      - name: Disposable server with reviewed Suliko Hello fixture
        shell: bash
        run: |
          set -euo pipefail
          # Pin verified fixture contents, not an unprovided review env gate.
          pinned_fixture_sha="4017b9fcfcbc2e4d8507d7942a24008b37a139bd"
          git fetch --no-tags --depth=1 origin "$pinned_fixture_sha"
          git diff --quiet "$pinned_fixture_sha" "$GITHUB_SHA" -- plugins/suliko-hello tests/parity || { echo "Fixture differs from pinned CI SHA"; exit 1; }
          echo "Fixture path content pinned to $pinned_fixture_sha; actual workflow SHA $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          web_dir="$RUNNER_TEMP/bb-parity-web"
          mkdir -p "$web_dir"
          export BB_DATA_DIR="$web_dir"
          export BB_SERVER_PORT=38887
          export BB_HOST_DAEMON_PORT=38889
          node stock-bb/packages/bb-app/dist/bb-app.js start --data-dir "$web_dir" --server-bind-host 127.0.0.1 --server-port 38887 --host-daemon-port 38889 --no-in-app-updates >"$RUNNER_TEMP/qa01-web.log" 2>&1 &
          ready=0
          for i in $(seq 1 45); do
            if BB_SERVER_PORT=38887 node stock-bb/packages/bb-app/dist/bb.js settings show --json >/dev/null 2>&1; then ready=1; break; fi
            sleep 2
          done
          if [[ "$ready" != 1 ]]; then
            echo "BB web did not fully boot; collect synthetic disposable daemon diagnostics"
            tail -100 "$RUNNER_TEMP/qa01-web.log" || true
            if [[ -d "$web_dir/logs" ]]; then
              find "$web_dir/logs" -maxdepth 1 -type f -print -exec tail -80 {} \;
            fi
            exit 1
          fi
          node stock-bb/packages/bb-app/dist/bb.js plugin install ./plugins/suliko-hello --yes
          echo "$web_dir" >"$RUNNER_TEMP/qa01-web-dir"
          echo "Loopback BB CLI and plugin-install fixture completed" >> "$GITHUB_STEP_SUMMARY"
      - name: Execute full 7×2 matrix and preserve result even on failure
        shell: bash
        run: |
          set -euo pipefail
          appimage="$(find stock-bb/apps/desktop/release -name '*.AppImage' -type f -print -quit)"
          test -n "$appimage" && test -s "$appimage"
          chmod +x "$appimage"
          export BB_PARITY_WEB_URL="http://127.0.0.1:38887"
          export BB_PARITY_ELECTRON_BINARY="$GITHUB_WORKSPACE/$appimage"
          export BB_PARITY_DATA_DIR="$RUNNER_TEMP/bb-parity-desktop"
          mkdir -p "$BB_PARITY_DATA_DIR"
          # Requires a pre-enrolled disposable host and Suliko Hello in both
          # data directories. Missing fixtures cause real test failures.
          set +e
          xvfb-run -a bash -c 'cd tests/parity && npx playwright test --config playwright.config.ts --reporter=json' >"$RUNNER_TEMP/qa01.json"
          code=$?
          set -e
          node scripts/qa01-parity-summary.mjs "$RUNNER_TEMP/qa01.json" >>"$GITHUB_STEP_SUMMARY"
          exit "$code"
      - name: Stop disposable BB server
        if: always()
        shell: bash
        run: |
          if [ -s "$RUNNER_TEMP/qa01-web-dir" ]; then
            node stock-bb/packages/bb-app/dist/bb-app.js stop --data-dir "$(cat "$RUNNER_TEMP/qa01-web-dir")" >/dev/null 2>&1 || true
          fi

      - name: Preserve disposable server startup log on test failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: d040-parity-web-startup-log
          path: |
            ${{ runner.temp }}/qa01-web.log
            ${{ runner.temp }}/bb-parity-web/logs/
          if-no-files-found: warn
          retention-days: 7
