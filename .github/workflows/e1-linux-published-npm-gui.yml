name: D-141 official Linux AppImage GUI + published bb-app npm CLI real Hello SEC02 (PARTIAL)
concurrency:
  group: d141-linux-npm-gui-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [feat/d141-linux-published-npm-gui]
    paths:
      - '.github/workflows/e1-linux-published-npm-gui.yml'
      - 'scripts/suliko-setup.sh'
      - 'scripts/suliko-stage-linux.sh'
      - 'scripts/verify-hardened.sh'
      - 'config/hardened/.env.hardened'
      - 'plugins/suliko-hello/**'
      - 'tests/parity/d134-linux-installed-appimage.mjs'
  workflow_dispatch:
permissions: read-all
jobs:
  integrated-linux-candidate:
    if: github.repository == 'dol-1/suliko-ide-ci'
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    env:
      CI: 'true'
      BB_TELEMETRY: 'false'
      BB_SERVER_BIND_HOST: '127.0.0.1'
      BB_SERVER_PORT: '38906'
      BB_HOST_DAEMON_PORT: '38907'
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: get-bb/bb
          ref: desktop-v0.49.0
          path: stock-bb
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.19.0'
          package-manager-cache: false
      - name: Verify pinned source commit and install actual exact published npm bb-app into runner TEMP
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C stock-bb rev-parse HEAD)" = "7b26cae79ec978fafd0a5db0e8517e94f12eb8f4"
          pkg="$RUNNER_TEMP/d141-published-npm-runtime"
          mkdir -m 700 -p "$pkg"
          npm --prefix "$pkg" install --no-audit --no-fund --save-exact bb-app@0.49.0
          node - "$pkg/node_modules/bb-app/package.json" <<'NODE'
          const p=require(process.argv[2]);
          if(p.name!=='bb-app'||p.version!=='0.49.0')throw Error('Unexpected published stock CLI version');
          NODE
          test -x "$pkg/node_modules/.bin/bb"
          test -x "$pkg/node_modules/.bin/bb-app"
      - name: Prepare test-only pinned Playwright Electron harness
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix tests/parity install --no-save --no-package-lock --no-audit --no-fund '@playwright/test@1.56.0'
      - name: Verify/install official AppImage, launch, live SEC02 and Hello, clean owned stage
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$(id -u)" -ne 0
          test "$(uname -m)" = x86_64
          command -v xvfb-run >/dev/null
          command -v ss >/dev/null
          home="$RUNNER_TEMP/d091-owned-home"
          export HOME="$home" BB_DATA_DIR="$home/bb-disposable"
          mkdir -m 700 -p "$home" "$BB_DATA_DIR"
          export PATH="$RUNNER_TEMP/d141-published-npm-runtime/node_modules/.bin:$PATH"
          test "$(node -p "require('$RUNNER_TEMP/d141-published-npm-runtime/node_modules/bb-app/package.json').version")" = "0.49.0"
          command -v bb
          command -v bb-app
          begin="$(date +%s)"
          app_pid=""
          stop_app() {
            set +e
            if [[ -n "$app_pid" ]]; then
              kill -TERM -- "-$app_pid" >/dev/null 2>&1 || true
              sleep 2
              kill -KILL -- "-$app_pid" >/dev/null 2>&1 || true
              wait "$app_pid" >/dev/null 2>&1 || true
              app_pid=""
            fi
          }
          cleanup() {
            stop_app
            bb-app stop --data-dir "$BB_DATA_DIR" >/dev/null 2>&1 || true
            HOME="$home" bash scripts/suliko-stage-linux.sh --remove-stage >/dev/null 2>&1 || true
            HOME="$home" bash scripts/suliko-setup.sh --uninstall >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          bash scripts/suliko-setup.sh --dry-run >/dev/null
          # One user-facing command stages the exact official AppImage; source CLI
          # below is a SEPARATE CI-only fixture, not integrated user setup.
          bash scripts/suliko-setup.sh --install >/dev/null
          app="$home/.local/share/suliko-ide/bb-0.49.0-x86_64.AppImage"
          launcher="$home/.local/bin/suliko-bb-desktop"
          test -x "$app"
          test "$(readlink "$launcher")" = "$app"
          printf '%s  %s\n' '8349ab773715624fec5082739c817d2a15809504699d34b47d3d9dfbe60fc770' "$app" | sha256sum -c - >/dev/null
          # Nonprivileged packaged GUI liveness. No provider key or remote host.
          setsid xvfb-run -a "$app" >"$RUNNER_TEMP/d091-app.log" 2>&1 &
          app_pid=$!
          sleep 20
          kill -0 "$app_pid" 2>/dev/null || { echo 'D091 official GUI exited prematurely'; exit 1; }
          stop_app
          # Actual officially published versioned npm binary, NOT source CLI.
          bb-app start --data-dir "$BB_DATA_DIR" --server-bind-host 127.0.0.1 \
            --server-port 38906 --host-daemon-port 38907 --no-in-app-updates \
            >"$RUNNER_TEMP/d141-published-server.log" 2>&1 &
          ready=0
          for i in $(seq 1 45); do
            if bb plugin list --json >"$RUNNER_TEMP/d091-before.json" 2>/dev/null; then ready=1; break; fi
            sleep 2
          done
          if [[ "$ready" != 1 ]]; then echo 'D091 live BB plugin CLI did not become ready'; exit 1; fi
          node - "$RUNNER_TEMP/d091-before.json" <<'NODE' >"$RUNNER_TEMP/d091-forbidden"
          const fs=require('node:fs'),value=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(!Array.isArray(value.plugins))throw Error('Missing BB plugin list');
          const forbidden=new Set(['bb--mcp','account-pool','connect','bb--connect-next','memory']);
          for(const id of forbidden){
            const found=value.plugins.filter(p=>p.id===id);
            if(found.length>1)throw Error('Duplicate forbidden stock plugin ID');
            if(found.length===1&&found[0].enabled===true)console.log(id);
          }
          NODE
          while IFS= read -r p; do
            [[ -n "$p" ]] || continue
            bb plugin disable "$p" >/dev/null
          done < "$RUNNER_TEMP/d091-forbidden"
          bb plugin install ./plugins/suliko-hello --yes >/dev/null
          bb plugin list --json >"$RUNNER_TEMP/d091-after.json"
          node - "$RUNNER_TEMP/d091-after.json" <<'NODE'
          const fs=require('node:fs'),value=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(!Array.isArray(value.plugins))throw Error('Missing installed plugins');
          for(const id of ['bb--mcp','account-pool','connect','bb--connect-next','memory']){
            const found=value.plugins.filter(p=>p.id===id);
            if(found.length>1||found.length===1&&(found[0].enabled!==false||found[0].status!=='disabled'))
              throw Error('Published BB forbidden plugin not hardened');
          }
          const hello=value.plugins.filter(p=>p.id==='suliko-hello'||p.id==='bb-plugin-suliko-hello');
          if(hello.length!==1||hello[0].enabled!==true)throw Error('Own Hello not enabled in published BB');
          NODE
          bash scripts/verify-hardened.sh
          # D134: test the own Hello panel mounted by the actual *official
          # installed AppImage*, not only the separate pinned-source CLI.
          project="$home/d134-linux-synthetic"
          mkdir -m 700 -p "$project"
          printf '%s\n' 'Disposable project only' > "$project/README.md"
          git -C "$project" init -b main >/dev/null
          git -C "$project" add README.md
          bb project create --name d134-linux-synthetic --root "$project" >/dev/null
          export D134_OFFICIAL_APPIMAGE="$app"
          export D134_BB_WEB_URL='http://127.0.0.1:38906/'
          xvfb-run -a node tests/parity/d134-linux-installed-appimage.mjs
          ss -ltn >"$RUNNER_TEMP/d091-listeners"
          grep -Eq '127[.]0[.]0[.]1:38906([[:space:]]|$)' "$RUNNER_TEMP/d091-listeners"
          grep -Eq '127[.]0[.]0[.]1:38907([[:space:]]|$)' "$RUNNER_TEMP/d091-listeners"
          bb-app stop --data-dir "$BB_DATA_DIR" >/dev/null
          bash scripts/suliko-setup.sh --uninstall >/dev/null
          test ! -e "$app" && test ! -L "$launcher" && test ! -f "$home/.cache/suliko-ide/bb-0.49.0-x86_64.AppImage"
          elapsed="$(($(date +%s)-begin))"
          echo "SETUP_ELAPSED_SECONDS=$elapsed"
          echo "SETUP_ELAPSED_SECONDS=$elapsed" >> "$GITHUB_STEP_SUMMARY"
          echo 'D141 official installed Linux AppImage Hello GUI driven by genuine published bb-app@0.49.0 npm CLI real hardened local own Hello, separate from one-command stage; NO 3OS integrated/RC/beta GO.' >> "$GITHUB_STEP_SUMMARY"
          test "$elapsed" -lt 900
