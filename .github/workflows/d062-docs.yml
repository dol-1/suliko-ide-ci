name: D-062 public docs build and privacy guard (NO deploy yet)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [feat/d062-doc-site, feat/d062-public-docs-links-hardening, fix/d086-pages-preflight, feat/d095-public-docs-readiness, fix/d107-macos-user-docs-actual-evidence, main]
    paths:
      - 'site/**'
      - '.github/workflows/d062-docs.yml'
      - 'scripts/docs-check.py'
      - 'scripts/docs-check.test.py'
      - 'scripts/docs-license-check.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  site:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    outputs:
      deploy_enabled: ${{ steps.pages_probe.outputs.enabled }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate public-only pages, internal links and KA text
        run: python3 scripts/docs-check.py
      - name: Validate public link policy negative fixtures
        run: python3 scripts/docs-check.test.py
      - name: Install pinned MIT documentation generator in disposable venv
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/suliko-docs-venv"
          "$RUNNER_TEMP/suliko-docs-venv/bin/pip" install --disable-pip-version-check --no-input 'mkdocs-material==9.8.1'
      - name: Validate installed Python documentation dependency licenses
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/suliko-docs-venv/bin/python" scripts/docs-license-check.py --self-test
          "$RUNNER_TEMP/suliko-docs-venv/bin/python" scripts/docs-license-check.py
      - name: Strict build, no deployment or public artifact
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/suliko-docs-venv/bin/mkdocs" build --strict --config-file site/mkdocs.yml --site-dir "$RUNNER_TEMP/suliko-docs-built"
          test -s "$RUNNER_TEMP/suliko-docs-built/index.html"
          test -s "$RUNNER_TEMP/suliko-docs-built/pilot.en/index.html"
          test -s "$RUNNER_TEMP/suliko-docs-built/pilot.ka/index.html"
          echo "Static docs build and dependency license gate passed." >> "$GITHUB_STEP_SUMMARY"
      - name: Check official Pages API; skip deployment if unconfigured
        id: pages_probe
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          enabled=false
          if [[ "$GITHUB_REF" == refs/heads/main && "$GITHUB_EVENT_NAME" == push ]]; then
            result="$RUNNER_TEMP/d086-pages-config.json"
            if gh api --silent "repos/$GITHUB_REPOSITORY/pages" > "$result" 2>/dev/null; then
              if node -e 'const j=require(process.argv[1]);process.exit(j.build_type==="workflow"&&typeof j.html_url==="string"&&j.html_url.startsWith("https://")?0:1)' "$result"; then
                enabled=true
              fi
            fi
            rm -f -- "$result"
          fi
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
          if [[ "$enabled" == true ]]; then
            echo 'D086: Pages workflow deployment enabled; checks passed.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'D086: Pages not workflow-configured; docs built successfully, upload/deployment skipped.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload public-only site for deployment on main
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && steps.pages_probe.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: ${{ runner.temp }}/suliko-docs-built

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.site.outputs.deploy_enabled == 'true'
    needs: site
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish reviewed static docs to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
