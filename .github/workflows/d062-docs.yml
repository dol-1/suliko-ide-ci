name: D-168 E5 KA EN docs parity and guarded Pages preflight
# D253 exact-head: genuine pinned npm registry report plus unweakened 14-way CI source gate.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [feat/d253-npm-weekly-risk-watch, feat/d202-uninstall-after-d230, feat/d230-first15-after-d226, fix/d226-premerge-after-d227, feat/d233-windows-trust-after-d211, feat/d211-28routes-after-d229, feat/d229-main-completeness-after-d210, feat/d214-support-runbook-after-d224, feat/d223-changelog-after-d206-main, feat/d206-rc1-notes-after-d208, feat/d208-pilot-kit-after-d220, feat/d220-pages-v501-after-d225, feat/d218-tag-install-docs-after-d217, fix/d215-rc-pin-d117-icon-main-green, feat/d204-live-pages-check, fix/d203-pages-api-response-ownerlint, feat/d203-pages-api-only-gate, feat/d198-doctor-after-d197, feat/d190-docs-as-test-3os, feat/d185-e1-integrated-ci-docs, feat/d179-pilot-self-service, feat/d178-windows-gui-wsl2-caveat, feat/d062-doc-site, feat/d062-public-docs-links-hardening, fix/d086-pages-preflight, feat/d095-public-docs-readiness, fix/d107-macos-user-docs-actual-evidence, fix/d115-windows-caveat, feat/d132-docs-windows-gui-proof, feat/d136-docs-installed-gui-matrix, feat/d147-pilot-metrics-ka-en, feat/d141-docs-3os-singleentry-scope, feat/d168-pages-preflight-main, main]
    paths:
      - 'scripts/d202-exact-head-gate.mjs'
      - 'scripts/d230-first15-metrics.mjs'
      - 'tests/parity/d211-docs-axe.mjs'
      - 'scripts/d233-trust-parity.test.py'
      - 'scripts/d226-d083-policy.mjs'
      - 'site/**'
      - 'docs/ops/PILOT-SUPPORT-RUNBOOK.md'
      - 'scripts/d214-pilot-support-lint.mjs'
      - '.github/workflows/d062-docs.yml'
      - '.github/workflows/d063-semgrep.yml'
      - '.github/workflows/d063-gitleaks.yml'
      - '.github/workflows/d158-codeql-own-source.yml'
      - '.github/workflows/d152-workflow-expression-guard.yml'
      - 'scripts/docs-check.py'
      - 'scripts/docs-check.test.py'
      - 'scripts/d203-pages-gate.test.py'
      - 'scripts/d204-live-pages-links.mjs'
      - 'scripts/d218-tag-install-docs.mjs'
      - 'scripts/d208-pilot-kit-parity.test.py'
      - 'scripts/d206-release-parity.test.py'
      - 'scripts/d223-changelog-parity.test.py'
      - 'docs/release/CHANGELOG.md'
      - 'docs/release/v0.1.0-rc.1.md'
      - 'docs/pilot/D208-OWNER-FREE-15MIN-KIT.md'
      - 'scripts/d220-deploy-pages-pin.test.mjs'
      - '.github/workflows/d218-tag-install-3os.yml'
      - 'marketplace/rc/**'
      - 'docs/owner-pack/ENABLE-PAGES.md'
      - 'scripts/docs-license-check.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  site:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    outputs:
      deploy_enabled: ${{ steps.pages_probe.outputs.enabled }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate public-only pages, internal links and KA text
        run: python3 scripts/docs-check.py
      - name: Validate public link policy negative fixtures
        run: python3 scripts/docs-check.test.py
      - name: D203 verify API-only Pages gate and disabled-safe owner single action
        run: python3 scripts/d203-pages-gate.test.py
      - name: D204 fixed public live URL specification and rejection fixtures
        run: node scripts/d204-live-pages-links.mjs --self-test
      - name: D220 deploy-pages immutable SHA v5.0.1 contract
        run: node scripts/d220-deploy-pages-pin.test.mjs
      - name: D233 bilingual NotSigned hash trust guide and no-bypass negative fixtures
        run: python3 scripts/d233-trust-parity.test.py
      - name: D214 pilot support draft, privacy and non-bypass negative tests
        run: node scripts/d214-pilot-support-lint.mjs
      - name: D208 KA EN 15-minute pilot kit and privacy lint
        run: python3 scripts/d208-pilot-kit-parity.test.py
      - name: D206 immutable-tag RC1 KA EN source SHA and release safety parity
        run: |
          python3 scripts/d206-release-parity.test.py
          echo 'D206_RC1_TAG_40HEX_ARCHIVE_64HEX_D202_UNMERGED_KA_EN=PASS_SOURCE_ONLY_NOT_RELEASE' >> "$GITHUB_STEP_SUMMARY"
      - name: D223 KA EN rc1 changelog exact-source and no public release parity
        run: python3 scripts/d223-changelog-parity.test.py
      - name: Install pinned MIT documentation generator in disposable venv
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/suliko-docs-venv"
          "$RUNNER_TEMP/suliko-docs-venv/bin/pip" install --disable-pip-version-check --no-input 'mkdocs-material==9.8.1'
      - name: Validate installed Python documentation dependency licenses
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/suliko-docs-venv/bin/python" scripts/docs-license-check.py --self-test
          "$RUNNER_TEMP/suliko-docs-venv/bin/python" scripts/docs-license-check.py
      - name: Strict build, no deployment or public artifact
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/suliko-docs-venv/bin/mkdocs" build --strict --config-file site/mkdocs.yml --site-dir "$RUNNER_TEMP/suliko-docs-built"
          test -s "$RUNNER_TEMP/suliko-docs-built/index.html"
          test -s "$RUNNER_TEMP/suliko-docs-built/pilot.en/index.html"
          test -s "$RUNNER_TEMP/suliko-docs-built/pilot.ka/index.html"
          test -s "$RUNNER_TEMP/suliko-docs-built/pilot-start.en/index.html"
          test -s "$RUNNER_TEMP/suliko-docs-built/pilot-start.ka/index.html"
          test -s "$RUNNER_TEMP/suliko-docs-built/pilot-feedback.en/index.html"
          test -s "$RUNNER_TEMP/suliko-docs-built/pilot-feedback.ka/index.html"
          test -s "$RUNNER_TEMP/suliko-docs-built/release.en/index.html"
          test -s "$RUNNER_TEMP/suliko-docs-built/release.ka/index.html"
          test -s "$RUNNER_TEMP/suliko-docs-built/changelog.en/index.html"
          test -s "$RUNNER_TEMP/suliko-docs-built/changelog.ka/index.html"
          test -s "$RUNNER_TEMP/suliko-docs-built/windows-trust.en/index.html"
          test -s "$RUNNER_TEMP/suliko-docs-built/windows-trust.ka/index.html"
          echo "D168 strict public-only KA/EN docs build, internal links, license and source parity PASS." >> "$GITHUB_STEP_SUMMARY"
      - name: D211 bounded rendered KA EN links and zero-critical axe gate, mobile viewport artifact before Pages publish
        shell: bash
        run: |
          set -euo pipefail
          (cd tests/parity && npm install --no-save --no-package-lock --no-audit --no-fund '@playwright/test@1.56.0' '@axe-core/playwright@4.14.0')
          (cd tests/parity && test "$(node -p "require('@playwright/test/package.json').version")" = '1.56.0')
          (cd tests/parity && npx playwright install chromium)
          python3 -m http.server 38895 --bind 127.0.0.1 --directory "$RUNNER_TEMP/suliko-docs-built" > "$RUNNER_TEMP/d211-server.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 25); do
            if curl --silent --fail --max-time 2 --output /dev/null http://127.0.0.1:38895/; then break; fi
            sleep 1
          done
          curl --silent --fail --max-time 3 --output /dev/null http://127.0.0.1:38895/
          D211_DOCS_ORIGIN=http://127.0.0.1:38895 D211_OUTPUT_DIR="$RUNNER_TEMP/d211-mobile-screens" node tests/parity/d211-docs-axe.mjs --self-test
          D211_DOCS_ORIGIN=http://127.0.0.1:38895 D211_OUTPUT_DIR="$RUNNER_TEMP/d211-mobile-screens" node tests/parity/d211-docs-axe.mjs
      - name: Retain exactly 4 public-docs mobile 375px screenshots for 1 day
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: d211-public-docs-mobile-375
          path: ${{ runner.temp }}/d211-mobile-screens/*.png
          retention-days: 1
          if-no-files-found: error
      - name: Verify official GitHub Pages API workflow mode (D203; main push only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        id: pages_probe
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          enabled=false
          if [[ "$GITHUB_REF" == refs/heads/main && "$GITHUB_EVENT_NAME" == push ]]; then
            result="$RUNNER_TEMP/d086-pages-config.json"
            if gh api "repos/$GITHUB_REPOSITORY/pages" > "$result" 2>/dev/null && test -s "$result"; then
              if node -e 'try{const j=require(process.argv[1]);process.exit(j.build_type==="workflow"&&typeof j.html_url==="string"&&j.html_url.startsWith("https://")?0:1)}catch{process.exit(1)}' "$result" 2>/dev/null; then
                enabled=true
              fi
            fi
            rm -f -- "$result"
          fi
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
          if [[ "$enabled" == true ]]; then
            echo 'D086: Pages workflow deployment enabled; checks passed.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'D086: Pages not workflow-configured; docs built successfully, upload/deployment skipped.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload public-only site for deployment on main
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && steps.pages_probe.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: ${{ runner.temp }}/suliko-docs-built

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.site.outputs.deploy_enabled == 'true'
    needs: site
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish reviewed static docs to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346

  live-check:
    if: needs.deploy.result == 'success'
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.19.0'
          package-manager-cache: false
      - name: Real deployed public KA EN homepage plus installed docs and Remote mock evidence
        shell: bash
        run: node scripts/d204-live-pages-links.mjs --live
      - name: Record actual public route evidence, no release assertion
        shell: bash
        run: echo 'D204 live 8 public KA EN routes reachable with Remote demo text and internal links; independent Pages deployment succeeded, NOT a beta or signed package.' >> "$GITHUB_STEP_SUMMARY"
