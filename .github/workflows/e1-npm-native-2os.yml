name: D-150 published stock bb-app 0.49.0 native Mac and Windows loopback (NO E1 release)
on:
  push:
    branches: [feat/d150-published-npm-cli-mac-win, main]
    paths:
      - '.github/workflows/e1-npm-native-2os.yml'
      - 'scripts/d150-published-npm-native.mjs'
  workflow_dispatch:
concurrency:
  group: d150-npm-native-${{ github.ref }}
  cancel-in-progress: true
permissions: read-all
jobs:
  native-published-cli:
    if: github.repository == 'dol-1/suliko-ide-ci'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      CI: 'true'
      BB_TELEMETRY: 'false'
      BB_SERVER_BIND_HOST: '127.0.0.1'
      BB_SERVER_PORT: '39061'
      BB_HOST_DAEMON_PORT: '39062'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.19.0'
          package-manager-cache: false
      - name: Execute actual published bb-app versioned CLI under native disposable user data
        shell: bash
        run: |
          node scripts/d150-published-npm-native.mjs
          echo 'Only real published bb-app@0.49.0 native loopback plugin list checked; independently authenticated publisher digest, real setup/SEC02/Hello/RC not established.' >> "$GITHUB_STEP_SUMMARY"
