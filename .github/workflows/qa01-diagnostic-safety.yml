name: QA-01 categorical UI diagnostic leak contract (synthetic only)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [feat/qa01-45s-categorical-controls]
    paths:
      - 'tests/parity/diagnose-controls.mjs'
      - 'tests/parity/diagnose-controls-safe.mjs'
      - 'tests/parity/diagnose-controls-safe.test.mjs'
      - '.github/workflows/qa01-diagnostic-safety.yml'
  workflow_dispatch:
permissions: read-all
jobs:
  synthetic-safety:
    if: github.repository == 'dol-1/suliko-ide-ci'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.19.0'
          package-manager-cache: false
      - name: Fixed-output schema and synthetic nonleak negatives
        shell: bash
        run: |
          set -euo pipefail
          node --check tests/parity/diagnose-controls.mjs
          node --test tests/parity/diagnose-controls-safe.test.mjs
          echo 'QA01 synthetic diagnostic safety ONLY; NOT 14/14 parity.' >> "$GITHUB_STEP_SUMMARY"
