name: "Suliko IDE — pilot signup / პილოტის რეგისტრაცია"
description: "Voluntary pre-release pilot interest / ნებაყოფლობითი პილოტის ინტერესი — PUBLIC ISSUE."
title: "[Pilot] "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for your interest in testing Suliko IDE.
        **This is a PUBLIC GitHub issue.** Do not post your email, phone number, real name, age, address, employer, access tokens, screenshots of accounts, or private work.
        Responses and follow-ups happen through GitHub notifications on this issue. Signing up does not guarantee immediate access or imply that beta is ready.
        ეს საჯარო GitHub საკითხია. არ გააზიაროთ სახელი, ასაკი, ელფოსტა, ტელეფონი, მისამართი, პირადი პროექტი, გასაღები ან ანგარიშის სურათი.
        რეგისტრაცია მხოლოდ ინტერესის გამოხატვაა: ბეტა ჯერ არ არის ხელმისაწვდომი, მონაწილეობა ნებაყოფლობითია.
        You can close your issue to withdraw. A closed issue remains visible; ask maintainers if you need public text removed.
  - type: dropdown
    id: os
    attributes:
      label: Device operating system / ოპერაციული სისტემა
      description: Choose the main test OS / აირჩიეთ ძირითადი სატესტო სისტემა.
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Preferred client / სასურველი კლიენტი
      options:
        - Desktop
        - Web via private Tailscale access
        - Both
    validations:
      required: true
  - type: dropdown
    id: usage
    attributes:
      label: Intended use / გამოყენების ტიპი (პირადი დეტალების გარეშე)
      options:
        - Coding and navigation
        - Plugin panels
        - Remote status review
        - General first-time use
    validations:
      required: true
  - type: dropdown
    id: cadence
    attributes:
      label: Two-week availability / შეძლებთ ორკვირიან ტესტირებას?
      options:
        - Yes, several days
        - Possibly, once or twice
        - Not yet, just interested
    validations:
      required: true
  - type: textarea
    id: goals
    attributes:
      label: One test task / ერთი სატესტო ამოცანა (არასავალდებულო)
      description: Describe a generic task only / დაწერეთ ზოგადი ამოცანა, არა კერძო რეპოზიტორია, გასაღები ან ანგარიშის დეტალი.
      placeholder: "For example: open an example project and view a plugin panel."
    validations:
      required: false
  - type: checkboxes
    id: public-consent
    attributes:
      label: Public posting acknowledgement / საჯაროობის დადასტურება
      options:
        - label: "This issue is public. I will not share personal information or secrets. / ეს საკითხი საჯაროა; პირად მონაცემებსა და გასაღებებს არ გავაზიარებ."
          required: true
